<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Magical Birthday Wish</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0d12; color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 90%; max-width: 500px; background: #1a1a24; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(255, 20, 147, 0.2); text-align: center; margin-bottom: 20px; }
        h1 { color: #ff1493; text-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493; font-size: 26px; margin-bottom: 20px;}
        .input-group { margin-bottom: 15px; text-align: left; background: #252532; padding: 15px; border-radius: 8px; border: 1px dashed #ff1493; }
        label { font-size: 14px; color: #b3b3b3; margin-bottom: 8px; display: block; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 12px; background: #1a1a24; border: 1px solid #00ffff; border-radius: 8px; color: white; font-size: 16px; box-sizing: border-box; outline: none; margin-bottom: 10px; }
        input[type="file"] { padding: 8px; border: none; flex: 1; color: white; }
        
        .music-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .music-item { display: flex; align-items: center; justify-content: space-between; background: #1a1a24; padding: 10px; border-radius: 8px; border: 1px solid #555; }
        .music-item label { margin: 0; display: flex; align-items: center; gap: 10px; cursor: pointer; color: white; font-size: 15px; flex: 1; }
        .play-btn { background: #00ffff; color: #000; border: none; border-radius: 50%; width: 35px; height: 35px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .upload-row { display: flex; gap: 10px; align-items: center; margin-bottom: 5px; }
        .upload-btn { background: #00ffff; color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .status-text { font-size: 13px; margin-bottom: 10px; font-weight: bold; }
        
        .btn { background: linear-gradient(45deg, #ff1493, #8a2be2); color: white; border: none; padding: 15px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .btn-outline { background: transparent; border: 2px dashed #00ffff; color: #00ffff; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold;}
        
        #generated-link-box { display: none; margin-top: 20px; background: #252532; padding: 15px; border-radius: 8px; border: 1px solid #00ffff; }
        #share-btn { background: #25D366; }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Create a Virtual Party ✨</h1>
        
        <form id="wish-form">
            <div class="input-group" style="border: 1px solid #00ffff;">
                <label>Birthday Person's Name *</label>
                <input type="text" id="bName" required placeholder="e.g. Rahul">
                
                <label>Main Title / Heading *</label>
                <input type="text" id="bTitle" required placeholder="e.g. A Special Surprise for You!">
                
                <label>Special Birthday Message *</label>
                <textarea id="bMessage" rows="3" required placeholder="Write a cute message..."></textarea>
                
                <label style="margin-top: 10px;">Choose Main Background Music 🎵</label>
                <div class="music-list">
                    <div class="music-item">
                        <label><input type="radio" name="bMusic" value="song1.mp3" checked> Birthday Theme</label>
                        <button type="button" class="play-btn" onclick="togglePreview(this, 'song1.mp3')">▶️</button>
                    </div>
                    <div class="music-item">
                        <label><input type="radio" name="bMusic" value="song2.mp3"> Romantic Theme</label>
                        <button type="button" class="play-btn" onclick="togglePreview(this, 'song2.mp3')">▶️</button>
                    </div>
                    <div class="music-item">
                        <label><input type="radio" name="bMusic" value="song3.mp3"> Fun Theme</label>
                        <button type="button" class="play-btn" onclick="togglePreview(this, 'song3.mp3')">▶️</button>
                    </div>
                </div>
                <audio id="preview-audio" style="display: none;"></audio>
            </div>

            <h3 style="color: #00ffff; font-size: 18px;">📸 Memory Timeline (Optional)</h3>
            <div id="dynamic-image-container"></div>
            <button type="button" class="btn-outline" onclick="addImageRow()">➕ Add Another Photo</button>
            <button type="submit" id="generate-btn" class="btn">🪄 Generate Link Instantly</button>
        </form>

        <div id="generated-link-box">
            <p>Your unique link is ready!</p>
            <input type="text" id="final-link" readonly style="width: 100%; margin-bottom: 10px;">
            <button class="btn" id="share-btn">📲 Share on WhatsApp</button>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const IMGBB_API_KEY = "1395060aec77631a4a081438a840fddf";
        const firebaseConfig = {
            apiKey: "AIzaSyDZjTje3kc9n7K1QfMVBFz1pbDw6-AUS8Q",
            authDomain: "birthday-maker-58e43.firebaseapp.com",
            projectId: "birthday-maker-58e43",
            storageBucket: "birthday-maker-58e43.firebasestorage.app",
            messagingSenderId: "213307256948",
            appId: "1:213307256948:web:4731c4d0c42ee6e978e121"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let imageCounter = 0; 
        const previewAudio = document.getElementById("preview-audio");
        let currentPlayBtn = null;

        window.onload = function() { addImageRow(); };

        function togglePreview(btnElement, url) {
            if (currentPlayBtn === btnElement && !previewAudio.paused) {
                previewAudio.pause(); btnElement.innerText = "▶️"; return;
            }
            document.querySelectorAll(".play-btn").forEach(btn => btn.innerText = "▶️");
            previewAudio.src = url; previewAudio.play();
            btnElement.innerText = "⏸️"; currentPlayBtn = btnElement;
        }

        function addImageRow() {
            imageCounter++;
            let id = imageCounter;
            let div = document.createElement("div");
            div.className = "input-group";
            div.innerHTML = `
                <label>Memory ${id}</label>
                <div class="upload-row">
                    <input type="file" id="file${id}" accept="image/*">
                    <button type="button" class="upload-btn" onclick="uploadSingleImage('${id}')">Upload</button>
                </div>
                <div id="status${id}" class="status-text" style="color: #ff1493;"></div>
                <input type="hidden" id="url${id}">
                <input type="text" id="cap${id}" placeholder="Caption for this memory...">
            `;
            document.getElementById("dynamic-image-container").appendChild(div);
        }

        function uploadSingleImage(idNumber) {
            let fileInput = document.getElementById('file' + idNumber);
            let statusText = document.getElementById('status' + idNumber);
            let urlInput = document.getElementById('url' + idNumber);
            let uploadBtn = fileInput.nextElementSibling;
            if(fileInput.files.length === 0) return;

            let formData = new FormData();
            formData.append("image", fileInput.files[0]);
            uploadBtn.disabled = true;

            let xhr = new XMLHttpRequest();
            xhr.open("POST", "https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    urlInput.value = JSON.parse(xhr.responseText).data.url; 
                    statusText.innerText = "✅ Uploaded!"; statusText.style.color = "#25D366"; uploadBtn.style.display = "none"; 
                }
            };
            xhr.send(formData);
        }

        document.getElementById("wish-form").addEventListener("submit", function(e) {
            e.preventDefault(); 
            this.style.display = "none"; 
            previewAudio.pause(); 

            let selectedMusic = document.querySelector('input[name="bMusic"]:checked').value;
            let photosArray = [];
            for(let i = 1; i <= imageCounter; i++) {
                let urlVal = document.getElementById("url" + i) ? document.getElementById("url" + i).value : "";
                let capVal = document.getElementById("cap" + i) ? document.getElementById("cap" + i).value : "";
                if(urlVal !== "") { photosArray.push({ url: urlVal, caption: capVal }); }
            }
            
            db.collection("wishes").add({
                name: document.getElementById("bName").value,
                title: document.getElementById("bTitle").value, // Naya Custom Title
                message: document.getElementById("bMessage").value,
                music: selectedMusic, 
                photos: photosArray, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then((docRef) => {
                document.getElementById("generated-link-box").style.display = "block";
                let realLink = window.location.origin + "/wish.html?id=" + docRef.id;
                document.getElementById("final-link").value = realLink;
                document.getElementById("share-btn").onclick = () => window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent('✨ I have a magical surprise for you: ' + realLink)}`);
            });
        });
    </script>
</body>
</html>
