<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gubbara Phulao - Birthday Wish</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
  }

  #stage1 {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    position: absolute;
    transition: opacity 0.4s ease;
  }

  .balloon-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 260px;
  }

  .balloon {
    width: 90px;
    height: 110px;
    background: radial-gradient(circle at 35% 30%, #ff8fa3, #e63950);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    position: relative;
    transform-origin: bottom center;
    transition: transform 0.08s ease-out;
    box-shadow: inset -10px -10px 20px rgba(0,0,0,0.15);
  }

  .balloon::after {
    content: '';
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 60px;
    background: #ccc;
  }

  .balloon.wobble {
    animation: wobble 1.6s ease-in-out infinite;
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }

  .instruction {
    color: white;
    font-size: 18px;
    text-align: center;
    padding: 0 20px;
    font-weight: 500;
  }

  .progress-text {
    color: #ffe066;
    font-size: 16px;
    font-weight: 700;
    height: 20px;
  }

  #holdBtn {
    background: #ffe066;
    color: #333;
    border: none;
    padding: 16px 40px;
    border-radius: 50px;
    font-size: 17px;
    font-weight: 700;
    box-shadow: 0 6px 0 #d4a900, 0 8px 15px rgba(0,0,0,0.3);
    cursor: pointer;
    transition: transform 0.05s;
  }

  #holdBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #d4a900;
  }

  /* Confetti */
  .confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 14px;
    opacity: 0.9;
    animation: fall linear forwards;
    z-index: 5;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.3; }
  }

  /* Pop flash */
  .flash {
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
  }

  /* Stage 2: Reveal */
  #stage2 {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
    padding: 30px;
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  #stage2.show {
    display: flex;
    opacity: 1;
  }

  .cake-emoji {
    font-size: 70px;
    animation: pop-in 0.5s cubic-bezier(.17,.89,.32,1.49);
  }

  @keyframes pop-in {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }

  .wish-title {
    color: white;
    font-size: 28px;
    font-weight: 800;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .wish-msg {
    color: #fff;
    font-size: 16px;
    max-width: 320px;
    line-height: 1.6;
    opacity: 0.95;
  }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .actions button {
    padding: 12px 24px;
    border-radius: 30px;
    border: none;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }

  .btn-share { background: #25D366; color: white; }
  .btn-thanks { background: white; color: #764ba2; }

  .shake {
    animation: shakeAnim 0.4s;
  }
  @keyframes shakeAnim {
    0%, 100% { transform: translate(0,0); }
    25% { transform: translate(-8px, 4px); }
    50% { transform: translate(8px, -4px); }
    75% { transform: translate(-4px, 6px); }
  }

  /* Stage 0: Create form */
  #stage0 {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 30px;
    width: 100%;
    max-width: 360px;
  }

  #stage0 h1 {
    color: white;
    font-size: 22px;
    text-align: center;
    margin-bottom: 6px;
  }

  #stage0 input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    outline: none;
  }

  #stage0 label {
    color: white;
    font-size: 13px;
    align-self: flex-start;
    opacity: 0.85;
    margin-bottom: -8px;
  }

  #createBtn {
    background: #ffe066;
    color: #333;
    border: none;
    padding: 14px 36px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 6px 0 #d4a900;
    cursor: pointer;
    margin-top: 10px;
    width: 100%;
  }

  #linkResult {
    display: none;
    width: 100%;
    background: rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 14px;
    color: white;
    font-size: 13px;
    word-break: break-all;
    text-align: center;
  }

  #copyBtn, #waSendBtn {
    background: white;
    color: #764ba2;
    border: none;
    padding: 10px 20px;
    border-radius: 30px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    margin-top: 10px;
  }
  #waSendBtn {
    background: #25D366;
    color: white;
    margin-left: 8px;
  }
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<!-- Stage 0: Create wish form -->
<div id="stage0">
  <h1>🎈 Birthday Wish Banao</h1>
  <label>Jiska birthday hai uska naam</label>
  <input type="text" id="toName" placeholder="Jaise: Sandeep" maxlength="20">
  <label>Aapka naam (sender)</label>
  <input type="text" id="fromName" placeholder="Jaise: Rahul" maxlength="20">
  <button id="createBtn">Link Banao 🎁</button>

  <div id="linkResult"></div>
</div>

<div id="stage1" style="display:none;">
  <div class="balloon-wrap">
    <div class="balloon wobble" id="balloon"></div>
  </div>
  <div class="progress-text" id="progressText"></div>
  <div class="instruction" id="holdInstruction">🎈 Gubbara phulane ke liye button dabaye rakho</div>
  <button id="holdBtn">Press &amp; Hold</button>
</div>

<div id="stage2">
  <div class="cake-emoji">🎂</div>
  <div class="wish-title" id="wishTitle">Happy Birthday! 🎉</div>
  <div class="wish-msg" id="wishMsg">Aapki zindagi khushiyon, hasi aur pyaar se bhari rahe. Ye saal aapke liye naye sapno aur unki poorti ka saal ho. 🎈✨</div>
  <div class="actions">
    <button class="btn-share">📲 Share Karo</button>
    <button class="btn-thanks">🙏 Thank You Bhejo</button>
  </div>
</div>

<audio id="popSound" src="" preload="auto"></audio>

<script>
  // ---------- Step A: Check URL for ?to=Name&from=Name ----------
  const params = new URLSearchParams(window.location.search);
  const toName = params.get('to');
  const fromName = params.get('from');

  const stage0 = document.getElementById('stage0');
  const stage1El = document.getElementById('stage1');

  if (toName) {
    // Someone opened a wish link -> skip the form, go straight to balloon
    stage0.style.display = 'none';
    stage1El.style.display = 'flex';
    document.getElementById('holdInstruction').textContent =
      `🎈 ${toName}, gubbara phulane ke liye button dabaye rakho`;
    document.getElementById('wishTitle').textContent = `Happy Birthday ${toName}! 🎉`;
    if (fromName) {
      document.getElementById('wishMsg').textContent =
        `${fromName} ki taraf se: Aapki zindagi khushiyon, hasi aur pyaar se bhari rahe. Ye saal naye sapno aur unki poorti ka saal ho. 🎈✨`;
    }
  } else {
    // No name in URL -> show the create form
    document.getElementById('createBtn').addEventListener('click', () => {
      const to = document.getElementById('toName').value.trim();
      const from = document.getElementById('fromName').value.trim();
      if (!to) { alert('Kripya naam daalein'); return; }

      const baseUrl = window.location.origin + window.location.pathname;
      const link = `${baseUrl}?to=${encodeURIComponent(to)}${from ? '&from=' + encodeURIComponent(from) : ''}`;

      const resultBox = document.getElementById('linkResult');
      resultBox.style.display = 'block';
      resultBox.innerHTML = `
        <div style="margin-bottom:8px;">✅ Link taiyaar hai!</div>
        <div style="font-weight:600;">${link}</div>
        <button id="copyBtn">📋 Copy Link</button>
        <button id="waSendBtn">📲 WhatsApp Bhejo</button>
      `;

      document.getElementById('copyBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(link);
        alert('Link copy ho gaya!');
      });
      document.getElementById('waSendBtn').addEventListener('click', () => {
        const msg = encodeURIComponent(`🎁 ${to}, tumhare liye kuch khaas bheja hai... kholo aur dekho! 👇\n${link}`);
        window.open(`https://wa.me/?text=${msg}`, '_blank');
      });
    });
  }

  // ---------- Step B: Balloon press-and-hold logic ----------
  const balloon = document.getElementById('balloon');
  const holdBtn = document.getElementById('holdBtn');
  const progressText = document.getElementById('progressText');
  const stage1 = document.getElementById('stage1');
  const stage2 = document.getElementById('stage2');
  const flash = document.getElementById('flash');
  const body = document.body;

  let scale = 1;
  let holding = false;
  let popped = false;
  let interval = null;

  const MAX_SCALE = 3.4;   // pop threshold
  const GROW_RATE = 0.045; // per tick
  const SHRINK_RATE = 0.02;

  function updateBalloon() {
    balloon.style.transform = `scale(${scale})`;
    const pct = Math.min(100, Math.round(((scale - 1) / (MAX_SCALE - 1)) * 100));
    progressText.textContent = pct > 0 ? pct + '%' : '';

    // color shifts redder as it grows
    const redness = Math.min(255, 200 + pct);
    balloon.style.background = `radial-gradient(circle at 35% 30%, #ff8fa3, rgb(${redness},${Math.max(30,57-pct*0.4)},${Math.max(50,80-pct*0.6)}))`;

    if (scale >= MAX_SCALE && !popped) {
      pop();
    }
  }

  function tick() {
    if (holding && !popped) {
      scale += GROW_RATE;
    } else if (!holding && scale > 1 && !popped) {
      scale = Math.max(1, scale - SHRINK_RATE);
    }
    updateBalloon();
  }

  function startHold(e) {
    e.preventDefault();
    holding = true;
    balloon.classList.remove('wobble');
  }

  function endHold(e) {
    holding = false;
  }

  holdBtn.addEventListener('mousedown', startHold);
  holdBtn.addEventListener('touchstart', startHold);
  holdBtn.addEventListener('mouseup', endHold);
  holdBtn.addEventListener('mouseleave', endHold);
  holdBtn.addEventListener('touchend', endHold);

  interval = setInterval(tick, 60);

  function pop() {
    popped = true;
    holding = false;

    // flash
    flash.style.transition = 'opacity 0.08s';
    flash.style.opacity = '1';
    setTimeout(() => { flash.style.opacity = '0'; }, 120);

    // screen shake
    body.classList.add('shake');
    setTimeout(() => body.classList.remove('shake'), 400);

    // hide balloon
    balloon.style.transition = 'transform 0.15s, opacity 0.15s';
    balloon.style.transform = 'scale(0)';
    balloon.style.opacity = '0';

    // confetti burst
    launchConfetti();

    // reveal stage 2 after short delay
    setTimeout(() => {
      stage1.style.opacity = '0';
      setTimeout(() => {
        stage1.style.display = 'none';
        stage2.classList.add('show');
      }, 400);
    }, 500);
  }

  function launchConfetti() {
    const colors = ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ffe066'];
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
      c.style.width = (Math.random() * 5 + 5) + 'px';
      c.style.height = (Math.random() * 10 + 8) + 'px';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3200);
    }
  }

  document.querySelector('.btn-thanks').addEventListener('click', () => {
    const baseUrl = window.location.origin + window.location.pathname;
    const thanksLink = `${baseUrl}?to=${encodeURIComponent(fromName || 'Dost')}&from=${encodeURIComponent(toName || '')}`;
    const msg = encodeURIComponent(`🙏 Thank you ${fromName || ''}! Ek surprise wapas tumhare liye: ${thanksLink}`);
    window.open(`https://wa.me/?text=${msg}`, '_blank');
  });
  document.querySelector('.btn-share').addEventListener('click', () => {
    const currentLink = window.location.href;
    const text = encodeURIComponent(`🎂 ${toName || 'Tumhare'} ke liye ek surprise wish! Dekho: ${currentLink}`);
    window.open(`https://wa.me/?text=${text}`, '_blank');
  });
</script>

</body>
</html>
