<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Magical Birthday Wish</title>
    <style>
        /* CSS: Dark Mode aur Neon Theme */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0d12; color: #ffffff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 90%; max-width: 500px; background: #1a1a24; padding: 30px; margin-top: 20px; border-radius: 15px; box-shadow: 0 0 20px rgba(255, 20, 147, 0.2); text-align: center; }
        h1 { color: #ff1493; text-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493; font-size: 24px; }
        .input-group { margin-bottom: 15px; text-align: left; background: #252532; padding: 15px; border-radius: 8px; border: 1px dashed #ff1493; }
        label { font-size: 14px; color: #b3b3b3; margin-bottom: 8px; display: block; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; background: #1a1a24; border: 1px solid #00ffff; border-radius: 8px; color: white; font-size: 16px; box-sizing: border-box; outline: none; margin-bottom: 10px; }
        input[type="file"] { padding: 8px; border: none; flex: 1; }
        .upload-row { display: flex; gap: 10px; align-items: center; margin-bottom: 5px; }
        .upload-btn { background: #00ffff; color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .upload-btn:hover { background: #ffffff; box-shadow: 0 0 10px #00ffff; }
        .status-text { font-size: 13px; margin-bottom: 10px; font-weight: bold; }
        .btn { background: linear-gradient(45deg, #ff1493, #8a2be2); color: white; border: none; padding: 15px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn:hover:not(:disabled) { box-shadow: 0 0 15px #ff1493; transform: scale(1.02); }
        .btn:disabled { background: #555; color: #aaa; cursor: not-allowed; box-shadow: none; transform: none; }
        .ad-space { width: 100%; height: 100px; background: #2a2a35; color: #666; display: flex; align-items: center; justify-content: center; margin: 20px 0; border: 1px dashed #555; border-radius: 8px; }
        #generated-link-box { display: none; margin-top: 20px; background: #252532; padding: 15px; border-radius: 8px; border: 1px solid #00ffff; }
        #share-btn { background: #25D366; }
    </style>
</head>
<body>

    <div class="ad-space" style="max-width: 500px;">Google AdSense Banner (Top)</div>

    <div class="container">
        <h1>✨ Create a Magical Wish ✨</h1>
        <p>Fill details & add photos to generate a surprise link!</p>
        
        <form id="wish-form">
            <!-- Basic Details -->
            <div class="input-group" style="border: 1px solid #00ffff;">
                <label>Birthday Person's Name *</label>
                <input type="text" id="bName" required placeholder="e.g. Rahul">
                
                <label>Secret Password *</label>
                <input type="text" id="bPassword" required placeholder="e.g. pet name ya favorite place">
                
                <label>Special Birthday Message *</label>
                <textarea id="bMessage" rows="3" required placeholder="Write a cute message..."></textarea>
            </div>

            <!-- Memory Timeline (Optional Photos with Live Upload) -->
            <h3 style="color: #00ffff; font-size: 18px;">📸 Scrollable Memory Timeline (Optional)</h3>
            
            <div class="input-group">
                <label>Memory 1 (Past / Childhood)</label>
                <div class="upload-row">
                    <input type="file" id="file1" accept="image/*">
                    <button type="button" class="upload-btn" onclick="uploadSingleImage('1')">Upload</button>
                </div>
                <div id="status1" class="status-text" style="color: #ff1493;"></div>
                <input type="hidden" id="url1">
                <input type="text" id="cap1" placeholder="Caption: Hum pehli baar yahan mile the...">
            </div>

            <div class="input-group">
                <label>Memory 2 (Funny Moment)</label>
                <div class="upload-row">
                    <input type="file" id="file2" accept="image/*">
                    <button type="button" class="upload-btn" onclick="uploadSingleImage('2')">Upload</button>
                </div>
                <div id="status2" class="status-text" style="color: #ff1493;"></div>
                <input type="hidden" id="url2">
                <input type="text" id="cap2" placeholder="Caption: Tumhari sabse funny photo...">
            </div>

            <div class="input-group">
                <label>Memory 3 (Recent / Best Photo)</label>
                <div class="upload-row">
                    <input type="file" id="file3" accept="image/*">
                    <button type="button" class="upload-btn" onclick="uploadSingleImage('3')">Upload</button>
                </div>
                <div id="status3" class="status-text" style="color: #ff1493;"></div>
                <input type="hidden" id="url3">
                <input type="text" id="cap3" placeholder="Caption: Aaj bhi tum waise hi ho...">
            </div>

            <!-- Main Generate Button -->
            <button type="submit" id="generate-btn" class="btn">🪄 Generate Link Instantly</button>
        </form>

        <div id="generated-link-box">
            <p>Your unique link is ready!</p>
            <input type="text" id="final-link" readonly style="width: 100%; margin-bottom: 10px;">
            <button class="btn" id="share-btn">📲 Share on WhatsApp</button>
        </div>
    </div>

    <div class="ad-space" style="max-width: 500px;">Google AdSense Banner (Bottom)</div>

    <!-- Firebase Scripts (Sirf Database ke liye) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // 1. IMGBB API KEY (Jo aapne share ki thi)
        const IMGBB_API_KEY = "1395060aec77631a4a081438a840fddf";

        // 2. FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDZjTje3kc9n7K1QfMVBFz1pbDw6-AUS8Q",
            authDomain: "birthday-maker-58e43.firebaseapp.com",
            projectId: "birthday-maker-58e43",
            storageBucket: "birthday-maker-58e43.firebasestorage.app",
            messagingSenderId: "213307256948",
            appId: "1:213307256948:web:4731c4d0c42ee6e978e121",
            measurementId: "G-Z2PYMXNTXC"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Tracker: Kitni photos abhi upload ho rahi hain
        let activeUploads = 0; 
        const generateBtn = document.getElementById("generate-btn");

        function updateButtonState() {
            if (activeUploads > 0) {
                generateBtn.disabled = true;
                generateBtn.innerText = "⏳ Uploading Photos... Please Wait";
            } else {
                generateBtn.disabled = false;
                generateBtn.innerText = "🪄 Generate Link Instantly";
            }
        }

        // ImgBB par Photo Upload karne ka Function
        function uploadSingleImage(idNumber) {
            let fileInput = document.getElementById('file' + idNumber);
            let statusText = document.getElementById('status' + idNumber);
            let urlInput = document.getElementById('url' + idNumber);
            let uploadBtn = fileInput.nextElementSibling;

            if(fileInput.files.length === 0) {
                statusText.innerText = "⚠️ Please select a photo first!";
                return;
            }

            let file = fileInput.files[0];
            let formData = new FormData();
            formData.append("image", file);

            // Upload shuru, button block karo
            activeUploads++;
            updateButtonState();

            uploadBtn.disabled = true;
            uploadBtn.style.background = "#555";

            // ImgBB API Request
            let xhr = new XMLHttpRequest();
            xhr.open("POST", "https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, true);

            // Progress Bar Logic
            xhr.upload.onprogress = function(event) {
                if (event.lengthComputable) {
                    let progress = (event.loaded / event.total) * 100;
                    statusText.innerText = "Uploading: " + Math.round(progress) + "% ⏳";
                    statusText.style.color = "#00ffff";
                }
            };

            // Jab Upload Pura Ho Jaye
            xhr.onload = function() {
                activeUploads--;
                updateButtonState();

                if (xhr.status === 200) {
                    let response = JSON.parse(xhr.responseText);
                    let imageURL = response.data.url; 
                    
                    urlInput.value = imageURL;
                    statusText.innerText = "✅ Uploaded Successfully!";
                    statusText.style.color = "#25D366";
                    uploadBtn.style.display = "none"; 
                } else {
                    statusText.innerText = "❌ Upload failed!";
                    statusText.style.color = "#ff4444";
                    uploadBtn.disabled = false;
                    uploadBtn.style.background = "#00ffff";
                }
            };

            xhr.onerror = function() {
                activeUploads--;
                updateButtonState();
                statusText.innerText = "❌ Internet issue!";
                statusText.style.color = "#ff4444";
                uploadBtn.disabled = false;
                uploadBtn.style.background = "#00ffff";
            };

            xhr.send(formData);
        }

        // Final Form Submit (Data + ImgBB Links)
        document.getElementById("wish-form").addEventListener("submit", function(e) {
            e.preventDefault(); 
            this.style.display = "none"; 
            
            db.collection("wishes").add({
                name: document.getElementById("bName").value,
                password: document.getElementById("bPassword").value,
                message: document.getElementById("bMessage").value,
                photo1: document.getElementById("url1").value, cap1: document.getElementById("cap1").value,
                photo2: document.getElementById("url2").value, cap2: document.getElementById("cap2").value,
                photo3: document.getElementById("url3").value, cap3: document.getElementById("cap3").value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then((docRef) => {
                document.getElementById("generated-link-box").style.display = "block";
                
                let realLink = window.location.origin + "/wish.html?id=" + docRef.id;
                document.getElementById("final-link").value = realLink;

                document.getElementById("share-btn").onclick = function() {
                    let text = `I have a magical surprise for you! ✨ Unlock it here: ${realLink}`;
                    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`);
                };
            })
            .catch((error) => {
                console.error("Error: ", error);
                alert("Data save hone me dikkat aayi!");
                this.style.display = "block"; 
            });
        });
    </script>
</body>
</html>
