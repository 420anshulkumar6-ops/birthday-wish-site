<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tumhari SEO Line -->
    <title>wishmaker.in - Make Wishing Video Card for WhatsApp Status</title>
    <meta name="description" content="Make Wishing Video Card for WhatsApp Status">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d0d12; color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; }

        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #1a1a24; border-bottom: 1px solid #252532; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: bold; color: #ff1493; text-shadow: 0 0 10px rgba(255,20,147,0.4); }
        .menu-toggle { font-size: 24px; cursor: pointer; display: none; }

        /* Layout */
        .main-layout { display: flex; flex: 1; max-width: 1400px; width: 100%; margin: 0 auto; }
        
        /* Naya Sidebar */
        aside { width: 260px; background: #14141c; border-right: 1px solid #252532; padding: 20px; }
        .aside-links { list-style: none; display: flex; flex-direction: column; gap: 15px; }
        .aside-links li a { color: #b3b3b3; text-decoration: none; font-size: 15px; font-weight: bold; display: block; padding: 10px; border-radius: 8px; transition: 0.3s; background: #1a1a24; border: 1px solid #252532; }
        .aside-links li a:hover { background: #ff1493; color: #fff; border-color: #ff1493; }

        /* Content */
        .content-area { flex: 1; padding: 30px; }
        .section-title { font-size: 22px; margin-bottom: 20px; color: #fff; border-left: 4px solid #00ffff; padding-left: 10px; }

        /* Theme Grid */
        .theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .theme-card { background: #1a1a24; border-radius: 12px; overflow: hidden; border: 1px solid #252532; text-align: center; padding-bottom: 15px;}
        
        /* Video Preview Area */
        .theme-preview { height: 200px; background: url('https://via.placeholder.com/300x400/252532/ffffff?text=Click+to+Play+Preview') center/cover; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .play-btn { font-size: 40px; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 50%; color: #00ffff; }
        
        .theme-info { padding: 15px; }
        .theme-info h4 { font-size: 16px; margin-bottom: 15px; color: white; }
        
        /* Updated Button Name */
        .btn-use { display: inline-block; width: 90%; background: linear-gradient(45deg, #00ffff, #0088ff); color: #000; padding: 12px; font-weight: bold; border-radius: 8px; text-decoration: none; transition: 0.3s; }
        .btn-use:hover { box-shadow: 0 0 15px rgba(0,255,255,0.5); transform: scale(1.02); }

        /* Full Screen Video Modal */
        #video-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; }
        #video-modal video { max-width: 90%; max-height: 80vh; border: 2px solid #00ffff; border-radius: 10px; }
        .close-btn { position: absolute; top: 20px; right: 30px; font-size: 40px; color: #ff1493; cursor: pointer; font-weight: bold; }

        @media(max-width: 768px) { aside { display: none; } .menu-toggle { display: block; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">wishmaker.in</div>
        <div class="menu-toggle">☰</div>
    </header>

    <div class="main-layout">
        <!-- Naya Sidebar -->
        <aside>
            <ul class="aside-links">
                <li><a href="#">🏠 Homepage</a></li>
                <li><a href="#">✨ Latest Video Card</a></li>
                <li><a href="#">🔥 Trending Video Card</a></li>
                <li><a href="#">📱 Our Social Media</a></li>
                <li><a href="#">🔗 Share Our Website</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <div class="content-area">
            <h2 class="section-title">🎂 Birthday Video Cards</h2>
            
            <div class="theme-grid">
                <!-- Theme Card 1 -->
                <div class="theme-card">
                    <!-- Preview Click opens Modal -->
                    <div class="theme-preview" onclick="openPreview()">
                        <div class="play-btn">▶</div>
                    </div>
                    <div class="theme-info">
                        <h4>Royal Blue Cake Theme</h4>
                    </div>
                    <!-- Redirects to Form Page (create.html) -->
                    <a href="create.html" class="btn-use">🚀 Use This Card</a>
                </div>

                <!-- Theme Card 2 (Dummy) -->
                <div class="theme-card">
                    <div class="theme-preview" onclick="openPreview()">
                        <div class="play-btn">▶</div>
                    </div>
                    <div class="theme-info">
                        <h4>Neon Birthday Bash</h4>
                    </div>
                    <a href="create.html" class="btn-use">🚀 Use This Card</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Preview Modal -->
    <div id="video-modal">
        <span class="close-btn" onclick="closePreview()">&times;</span>
        <h3 style="color:white; margin-bottom: 15px;">Sample Video Preview</h3>
        <video id="sample-video" controls playsinline>
            <source src="bg_video.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        function openPreview() {
            document.getElementById('video-modal').style.display = 'flex';
            document.getElementById('sample-video').play();
        }
        function closePreview() {
            document.getElementById('video-modal').style.display = 'none';
            document.getElementById('sample-video').pause();
            document.getElementById('sample-video').currentTime = 0;
        }
    </script>
</body>
</html>
