<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Magical Birthday Wish</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0d12; color: #ffffff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 90%; max-width: 500px; background: #1a1a24; padding: 30px; margin-top: 20px; border-radius: 15px; box-shadow: 0 0 20px rgba(255, 20, 147, 0.2); text-align: center; }
        h1 { color: #ff1493; text-shadow: 0 0 10px #ff1493, 0 0 20px #ff1493; font-size: 24px; }
        .input-group { margin-bottom: 15px; text-align: left; background: #252532; padding: 15px; border-radius: 8px; border: 1px dashed #ff1493; }
        input[type="text"], textarea { width: 100%; padding: 12px; background: #1a1a24; border: 1px solid #00ffff; border-radius: 8px; color: white; font-size: 16px; box-sizing: border-box; margin-bottom: 10px; }
        .music-item { display: flex; align-items: center; justify-content: space-between; background: #1a1a24; padding: 10px; border-radius: 8px; border: 1px solid #555; margin-bottom: 8px; }
        .play-btn { background: #00ffff; border-radius: 50%; width: 35px; height: 35px; border: none; cursor: pointer; }
        .btn { background: linear-gradient(45deg, #ff1493, #8a2be2); color: white; border: none; padding: 15px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Create a Magical Wish ✨</h1>
        <form id="wish-form">
            <input type="text" id="bName" required placeholder="Person's Name">
            <input type="text" id="bPassword" required placeholder="Secret Password">
            <textarea id="bMessage" rows="3" required placeholder="Birthday Message..."></textarea>
            
            <label>Choose Background Music 🎵</label>
            <div class="music-list">
                <div class="music-item"><label><input type="radio" name="bMusic" value="song1.mp3" checked> Birthday Piano</label><button type="button" class="play-btn" onclick="togglePreview(this, 'song1.mp3')">▶️</button></div>
                <div class="music-item"><label><input type="radio" name="bMusic" value="song2.mp3"> Romantic Theme</label><button type="button" class="play-btn" onclick="togglePreview(this, 'song2.mp3')">▶️</button></div>
                <div class="music-item"><label><input type="radio" name="bMusic" value="song3.mp3"> Funny Theme</label><button type="button" class="play-btn" onclick="togglePreview(this, 'song3.mp3')">▶️</button></div>
            </div>
            <audio id="preview-audio" style="display: none;"></audio>

            <div id="dynamic-image-container"></div>
            <button type="button" class="btn" style="background:#555" onclick="addImageRow()">➕ Add Another Photo</button>
            <button type="submit" id="generate-btn" class="btn">🪄 Generate Link</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        // ImgBB API Key
        const IMGBB_API_KEY = "1395060aec77631a4a081438a840fddf";
        firebase.initializeApp({/* Your Firebase Config */});
        const db = firebase.firestore();
        let imageCounter = 0;
        
        function togglePreview(btn, url) { 
            let audio = document.getElementById("preview-audio");
            if(audio.src.includes(url) && !audio.paused) { audio.pause(); btn.innerText="▶️"; }
            else { audio.src = url; audio.play(); btn.innerText="⏸️"; }
        }
        function addImageRow() { imageCounter++; let container = document.getElementById("dynamic-image-container"); let div = document.createElement("div"); div.className = "input-group"; div.innerHTML = `<input type="file" id="file${imageCounter}" accept="image/*"><button type="button" onclick="uploadSingleImage('${imageCounter}')">Upload</button><input type="text" id="cap${imageCounter}" placeholder="Caption...">`; container.appendChild(div); }
        // (Keep previous upload logic here)
    </script>
</body>
</html>
