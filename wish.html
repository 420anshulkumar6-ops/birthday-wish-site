<div style="position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.85); padding: 15px; z-index: 9999; color: white; font-family: sans-serif; box-sizing: border-box; border-top: 2px solid #00ffff;">
    <h4 style="margin: 0 0 10px 0; color: #00ffff;">Live Adjuster 🛠️</h4>
    
    <div style="margin-bottom: 10px;">
        <label style="color: #ff1493; font-size: 12px; font-weight: bold;">--- PHOTO SETTINGS ---</label><br>
        <label style="font-size: 14px;">Photo Upar/Niche (Top): <span id="p-top-val" style="color: #00ffff;">41%</span></label>
        <input type="range" min="20" max="60" step="0.1" value="41" oninput="document.querySelector('.user-photo').style.top = this.value + '%'; document.getElementById('p-top-val').innerText = this.value + '%';" style="width: 100%;">
        
        <label style="font-size: 14px;">Photo Size (Width): <span id="p-wid-val" style="color: #00ffff;">60.5%</span></label>
        <input type="range" min="30" max="80" step="0.1" value="60.5" oninput="document.querySelector('.user-photo').style.width = this.value + '%'; document.getElementById('p-wid-val').innerText = this.value + '%';" style="width: 100%;">
    </div>

    <div>
        <label style="color: #ff1493; font-size: 12px; font-weight: bold;">--- NAME SETTINGS ---</label><br>
        <label style="font-size: 14px;">Name Upar/Niche (Top): <span id="n-top-val" style="color: #00ffff;">60.5%</span></label>
        <input type="range" min="50" max="85" step="0.1" value="60.5" oninput="document.querySelector('.user-name').style.top = this.value + '%'; document.getElementById('n-top-val').innerText = this.value + '%';" style="width: 100%;">
    </div>
</div>
