<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Someone Sent You A Surprise!</title>
    <style>
        /* DJ Lights */
        @keyframes djLights { 0% { background-color: #ff00ff; } 15% { background-color: #00ffff; } 30% { background-color: #ffff00; } 45% { background-color: #ff0000; } 60% { background-color: #00ff00; } 75% { background-color: #0000ff; } 90% { background-color: #ff8c00; } 100% { background-color: #ff00ff; } }
        body.disco-mode { animation: djLights 0.8s infinite alternate; }
        
        /* Base Styling - Fixed for Equal Margins */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0d12; color: #ffffff; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; box-sizing: border-box; overflow: hidden;}
        
        /* Container - Perfectly fits inside body padding */
        .container { width: 100%; height: 100%; max-width: 500px; background: rgba(26, 26, 36, 0.9); padding: 15px; border-radius: 15px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); text-align: center; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Gift Box */
        .gift-emoji { font-size: 150px; cursor: pointer; display: inline-block; animation: bounce 1.2s infinite; text-shadow: 0 0 30px #ff1493; margin: 40px 0;}
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-30px); } 60% { transform: translateY(-15px); } }
        
        /* 📸 IMAGE MODULE WITH SLIDER ARROWS */
        .timeline-container { display: flex; flex-direction: column; align-items: center; width: 100%; position: relative; }
        .memory-card { background: #252532; padding: 6px; border-radius: 12px; border: 2px solid #ff1493; width: 100%; box-sizing: border-box; position: relative; display: flex; justify-content: center; align-items: center;}
        .memory-card img { width: 100%; height: 26vh; border-radius: 8px; object-fit: cover; display: block; }
        
        /* Transparent Navigation Arrows */
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.4); color: rgba(255, 255, 255, 0.8); border: none; font-size: 20px; padding: 8px 12px; cursor: pointer; z-index: 10; border-radius: 5px; backdrop-filter: blur(2px); transition: 0.3s; }
        .slider-btn:active { background: rgba(255, 20, 147, 0.6); }
        .slider-btn.left { left: 10px; }
        .slider-btn.right { right: 10px; }

        /* Message Box */
        .message-box { 
            width: 100%; background: rgba(37, 37, 50, 0.9); padding: 8px 15px; border: 2px solid #ff1493; border-radius: 8px; margin: 5px 0; line-height: 1.3; text-align: center; font-style: italic; box-sizing: border-box; height: 11vh; min-height: 60px; max-height: 80px; display: flex; align-items: center; justify-content: center; overflow-y: auto; 
        }
        
        /* 🎂 BIG CAKE BOX (Takes remaining space) */
        .cake-box { width: 100%; background: #252532; border: 2px solid #ff1493; border-radius: 12px; box-sizing: border-box; display: flex; justify-content: center; align-items: center; margin: 5px 0; flex: 1; min-height: 80px; box-shadow: inset 0 0 20px rgba(255, 20, 147, 0.1); }
        .decorative-cake { font-size: 70px; position: relative; animation: floatCake 3s ease-in-out infinite, pulseGlow 2s infinite alternate; filter: drop-shadow(0 0 15px rgba(255, 20, 147, 0.8)); margin-top: 15px; }
        .decorative-cake .flame { font-size: 30px; position: absolute; top: -28px; left: 18px; animation: flicker 0.5s infinite alternate; }
        
        @keyframes floatCake { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes flicker { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0.7; transform: scale(1.1); } }
        @keyframes pulseGlow { 0% { filter: drop-shadow(0 0 10px rgba(255, 20, 147, 0.5)); } 100% { filter: drop-shadow(0 0 35px rgba(255, 20, 147, 1)); } }

        /* SCRATCH CARD MODULE (Height reduced for perfect fit) */
        .scratch-container { position: relative; width: 100%; height: 70px; border-radius: 12px; overflow: hidden; border: 2px solid #ff1493; background: #fff; flex-shrink: 0;}
        .scratch-message { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #ff1493; text-align: center; padding: 5px; box-sizing: border-box; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; cursor: pointer; }

        /* Screens */
        #gift-screen { display: none; height: 100%; flex-direction: column; justify-content: center; align-items: center; }
        #surprise-screen { display: none; height: 100%; flex-direction: column; align-items: center; justify-content: space-between; } 
    </style>
</head>
<body>

    <div class="container" id="main-content-area">
        
        <h2 id="loading-text" style="color: #ff1493; text-shadow: 0 0 10px #ff1493; margin-top: 50px;">Loading Magic... ✨</h2>

        <div id="gift-screen">
            <h1 style="color: #ff1493; text-shadow: 0 0 10px #ff1493; font-size: 30px;">Surprise for you! 🎉</h1>
            <p style="font-size: 18px;">Tap the big gift box to open your surprise...</p>
            <div class="gift-emoji" onclick="openGift()">🎁</div>
        </div>

        <div id="surprise-screen">
            
            <div style="width: 100%;">
                <h1 style="font-size: 28px; color: #ff1493; text-shadow: 0 0 10px #ff1493; margin: 0 0 5px 0;">Happy Birthday <span id="display-name"></span>!</h1>
                <div style="font-size: 24px; display: flex; justify-content: center; gap: 20px; margin-bottom: 5px;">
                    <span>🎂</span><span>🎉</span><span>🥳</span><span>🎈</span>
                </div>
            </div>
            
            <div id="timeline" class="timeline-container">
                <div class="memory-card" id="slider-card">
                    <button class="slider-btn left" id="prev-btn" onclick="prevSlide()" style="display:none;">&#10094;</button>
                    <img id="slider-img" src="" alt="Memory">
                    <button class="slider-btn right" id="next-btn" onclick="nextSlide(false)" style="display:none;">&#10095;</button>
                </div>
            </div>

            <div class="message-box" id="display-message"></div>

            <div class="cake-box">
                <div class="decorative-cake">
                    <span class="flame">🔥</span>
                    🎂
                </div>
            </div>

            <div class="scratch-container" id="scratch-area" style="display:none;">
                <div class="scratch-message" id="scratch-text"></div>
                <canvas id="scratch-pad"></canvas>
            </div>

        </div>

    </div>

    <audio id="bg-audio" loop></audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDZjTje3kc9n7K1QfMVBFz1pbDw6-AUS8Q",
            authDomain: "birthday-maker-58e43.firebaseapp.com",
            projectId: "birthday-maker-58e43",
            storageBucket: "birthday-maker-58e43.firebasestorage.app",
            messagingSenderId: "213307256948",
            appId: "1:213307256948:web:4731c4d0c42ee6e978e121"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');
        let wishData = null;
        
        // Variables for Slider
        let currentSlide = 0;
        let slideInterval = null;
        let photosArray = [];

        if(docId) {
            db.collection("wishes").doc(docId).get().then((doc) => {
                document.getElementById("loading-text").style.display = "none";
                
                if (doc.exists) { 
                    wishData = doc.data(); 
                    document.getElementById("gift-screen").style.display = "flex";
                } 
                else { 
                    document.getElementById("main-content-area").innerHTML = "<h2 style='color:#ff4444;'>Oops! Link Expired or Invalid. 😥</h2>"; 
                }
            }).catch((error) => {
                document.getElementById("loading-text").style.display = "none";
                document.getElementById("main-content-area").innerHTML = "<h2 style='color:#ff4444;'>Network Error! Please Refresh the Page. 😥</h2>";
            });
        } else {
            document.getElementById("loading-text").style.display = "none";
            document.getElementById("main-content-area").innerHTML = "<h2 style='color:#ff4444;'>Invalid Link! 🚫</h2>"; 
        }

        function openGift() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen().catch(e => console.log(e)); }
            document.body.classList.add("disco-mode");

            if(wishData.music) {
                let audio = document.getElementById("bg-audio");
                audio.src = wishData.music; 
                audio.play().catch(e => console.log(e));
            }

            document.getElementById("gift-screen").style.display = "none";
            document.getElementById("surprise-screen").style.display = "flex";
            
            document.getElementById("display-name").innerText = wishData.name;
            
            // Dynamic Font Sizing for Message
            let msgBox = document.getElementById("display-message");
            let msgText = wishData.message || "";
            msgBox.innerText = msgText;
            
            let textLen = msgText.length;
            if(textLen < 40) {
                msgBox.style.fontSize = "17px";
            } else if(textLen < 100) {
                msgBox.style.fontSize = "14px";
            } else if(textLen < 180) {
                msgBox.style.fontSize = "12px";
            } else {
                msgBox.style.fontSize = "11px";
            }

            // Image Slider Setup
            if(wishData.photos && wishData.photos.length > 0) {
                photosArray = wishData.photos;
                document.getElementById('slider-img').src = photosArray[0].url;
                
                if(photosArray.length > 1) {
                    document.getElementById('prev-btn').style.display = 'block';
                    document.getElementById('next-btn').style.display = 'block';
                    slideInterval = setInterval(() => nextSlide(true), 2500); // 2.5 seconds auto slide
                }
            }

            // Scratch Card Setup
            if(wishData.scratch && wishData.scratch.trim() !== "") {
                document.getElementById("scratch-area").style.display = "block";
                document.getElementById("scratch-text").innerText = wishData.scratch;
                initScratchCard();
            }

            startConfettiLoop();
        }

        // --- SLIDER FUNCTIONS ---
        function nextSlide(isAuto = false) {
            if(!isAuto) { clearInterval(slideInterval); } // Stop auto if user clicks
            currentSlide = (currentSlide + 1) % photosArray.length;
            document.getElementById('slider-img').src = photosArray[currentSlide].url;
        }

        function prevSlide() {
            clearInterval(slideInterval); // Stop auto if user clicks
            currentSlide = (currentSlide - 1 + photosArray.length) % photosArray.length;
            document.getElementById('slider-img').src = photosArray[currentSlide].url;
        }

        // --- SCRATCH CARD LOGIC ---
        function initScratchCard() {
            const canvas = document.getElementById('scratch-pad');
            const ctx = canvas.getContext('2d');
            let rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = 70; // Set to 70px

            ctx.fillStyle = '#1a1a24';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = '22px Arial';
            ctx.fillStyle = '#00ffff';
            ctx.textAlign = "center";
            ctx.fillText('🪙 Scratch Here!', canvas.width/2, 42); // Text perfectly centered in 70px height

            let isDrawing = false;
            
            function getPos(e) {
                let r = canvas.getBoundingClientRect();
                let x = (e.clientX || e.touches[0].clientX) - r.left;
                let y = (e.clientY || e.touches[0].clientY) - r.top;
                return {x, y};
            }

            function scratch(e) {
                if(!isDrawing) return;
                e.preventDefault();
                let pos = getPos(e);
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 20, 0, Math.PI*2);
                ctx.fill();
            }

            canvas.addEventListener('mousedown', () => isDrawing = true);
            canvas.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('mousemove', scratch);
            
            canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, {passive: false});
            canvas.addEventListener('touchend', () => isDrawing = false);
            canvas.addEventListener('touchmove', scratch, {passive: false});
        }

        // --- CONFETTI LOOP ---
        function startConfettiLoop() {
            function shoot() {
                var duration = 1500; 
                var end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0 }, zIndex: 1000 });
                    confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1 }, zIndex: 1000 });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            }
            shoot(); 
            setInterval(shoot, 3500); 
        }
    </script>
</body>
</html>
