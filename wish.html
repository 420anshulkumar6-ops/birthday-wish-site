<!-- CSS me ye naya button box add kijiye -->
<style>
    /* ... (Aapka purana style waisa hi rahega) ... */
    
    /* Naye Download/Share Buttons ki CSS */
    .action-buttons {
        display: none; /* Gift open hone par JS se flex hoga */
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 400px;
        flex-direction: column;
        gap: 10px;
        z-index: 10; /* Video ke upar dikhega */
    }
    .action-btn {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        border: 1px solid #00ffff;
        padding: 12px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 15px;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    .btn-download { background: linear-gradient(45deg, #ff1493, #ff4500); border: none; }
    .btn-whatsapp { background: #25D366; border: none; }
</style>

<!-- Body ke andar Video Wrapper ke neeche ye add kijiye -->
<div class="action-buttons" id="action-panel">
    <button class="action-btn btn-download" onclick="alert('Processing your video... (Rendering server will be attached here later)')">⬇️ Download Video</button>
    <button class="action-btn btn-whatsapp" onclick="shareToWhatsApp()">📲 Share to WhatsApp Status</button>
    <button class="action-btn" onclick="copyLink()">🔗 Copy Link</button>
</div>

<!-- Script me openGift() function me isko dikhane ka logic add karein -->
<script>
    function openGift() {
        document.documentElement.requestFullscreen().catch(e => console.log("Fullscreen ignored"));
        
        let audio = document.getElementById("bg-audio");
        if(wishData.music) {
            audio.src = wishData.music;
            audio.volume = 0.8; 
            audio.play().catch(e => console.log("Audio play blocked"));
        }

        let bgVideo = document.getElementById("bg-video");
        bgVideo.muted = false; 
        bgVideo.volume = 0.2; 
        bgVideo.play().catch(e => console.log("Video play blocked")); 

        document.getElementById("gift-screen").style.display = "none";
        document.getElementById("surprise-screen").style.display = "block";
        
        // Buttons show karne ka trigger
        document.getElementById("action-panel").style.display = "flex";
        
        document.getElementById("user-img").src = wishData.photos[0].url;
        
        // ... (Aapka purana font sizing logic) ...
    }

    // Share Functions
    function shareToWhatsApp() {
        let currentLink = window.location.href;
        let text = `✨ I have a magical video card for you! Open it here: ${currentLink}`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`);
    }

    function copyLink() {
        let currentLink = window.location.href;
        navigator.clipboard.writeText(currentLink).then(() => {
            alert("Link Copied! Paste it anywhere.");
        });
    }
</script>
