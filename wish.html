<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday!</title>
    <style>
        /* Continuous Background Light Animation */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: #ffffff;
            animation: bgDiscoLights 8s infinite alternate;
        }

        @keyframes bgDiscoLights {
            0% { background-color: #0a001a; }
            33% { background-color: #1a0033; }
            66% { background-color: #001122; }
            100% { background-color: #1a001a; }
        }
        
        /* Top Neon Glow Border */
        .neon-border { position: fixed; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, #b100ff, #ff1493, #00ffff, #b100ff); background-size: 200% 200%; animation: gradientGlow 3s ease infinite; box-shadow: 0 0 15px #b100ff, 0 0 30px #ff1493; z-index: 100; }
        @keyframes gradientGlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Container Settings (Padding removed for full-width image) */
        .container { width: 100%; max-width: 500px; text-align: center; display: flex; flex-direction: column; min-height: 100vh; position: relative; }
        
        /* Gift Box Initial Screen */
        #gift-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #0d0d12; z-index: 50; }
        .gift-emoji { font-size: 150px; cursor: pointer; animation: bounce 1s infinite; text-shadow: 0 0 40px #b100ff; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        /* Surprise Screen Layout Fixed */
        #surprise-screen { display: none; flex-direction: column; align-items: center; padding-top: 20px; padding-bottom: 30px; gap: 15px; } /* Gap kam kiya taaki sab paas rahe */

        /* 1. Animated Heading */
        .animated-title { font-family: 'Georgia', cursive; font-size: 26px; color: #fff; font-weight: bold; text-shadow: 0 0 10px #b100ff, 0 0 20px #ff1493; white-space: nowrap; animation: slideLTR 4s ease-in-out infinite alternate; margin: 10px 0; padding: 0 15px;}
        @keyframes slideLTR { 0% { transform: translateX(-15px); } 100% { transform: translateX(15px); } }

        /* 2. Image Carousel Area */
        .slider-container { width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        /* Image now touches left and right edges (margin 0) */
        .slide-img { width: 100%; max-height: 50vh; object-fit: cover; border-top: 2px solid #b100ff; border-bottom: 2px solid #b100ff; box-shadow: 0 0 15px rgba(177, 0, 255, 0.4); }
        .slide-caption { margin-top: 8px; font-style: italic; color: #ccc; font-size: 16px; min-height: 20px; text-shadow: 0 0 5px #000; padding: 0 15px;}
        
        /* Buttons moved below image */
        .slider-controls { display: flex; justify-content: center; gap: 30px; margin-top: 10px; }
        .nav-btn { background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #b100ff; border-radius: 50%; width: 45px; height: 45px; font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 10px #b100ff; z-index: 10; }
        .nav-btn:active { background: #b100ff; }

        /* 3. Message Area Fixed */
        .message-box { width: 90%; background: rgba(26, 26, 36, 0.8); padding: 15px; border-left: 4px solid #b100ff; border-radius: 8px; font-size: 16px; line-height: 1.5; font-style: italic; text-align: center; box-shadow: 0 0 10px rgba(177, 0, 255, 0.2); box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="neon-border"></div>

    <div class="container" id="main-content-area">
        
        <!-- ENTRANCE: Gift Box -->
        <div id="gift-screen">
            <h2 style="color: #b100ff; text-shadow: 0 0 10px #b100ff;">A Special Surprise!</h2>
            <div class="gift-emoji" onclick="openGift()">🎁</div>
            <p style="color: #ccc;">Tap to open</p>
        </div>

        <!-- MAIN LAYOUT -->
        <div id="surprise-screen">
            <!-- Part 1: Animated Name -->
            <div class="animated-title" id="display-title">Happy Birthday!</div>

            <!-- Part 2: Image Slider -->
            <div class="slider-container" id="slider-area">
                <img src="" id="current-img" class="slide-img" alt="Memory" style="display:none;">
                <div class="slide-caption" id="current-cap"></div>
                
                <!-- Buttons Moved Below the Image -->
                <div class="slider-controls" id="slider-controls" style="display:none;">
                    <button class="nav-btn" id="btn-prev" onclick="manualSlide('prev')">&#10094;</button>
                    <button class="nav-btn" id="btn-next" onclick="manualSlide('next')">&#10095;</button>
                </div>
            </div>

            <!-- Part 3: Message -->
            <div class="message-box" id="display-message"></div>
        </div>

    </div>

    <!-- Audios -->
    <audio id="sfx-box" src="box.mp3"></audio>
    <audio id="bg-audio" loop></audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDZjTje3kc9n7K1QfMVBFz1pbDw6-AUS8Q",
            authDomain: "birthday-maker-58e43.firebaseapp.com",
            projectId: "birthday-maker-58e43",
            storageBucket: "birthday-maker-58e43.firebasestorage.app",
            messagingSenderId: "213307256948",
            appId: "1:213307256948:web:4731c4d0c42ee6e978e121"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');
        let wishData = null;
        
        let photos = [];
        let currentSlideIndex = 0;
        let slideInterval = null;

        if(docId) {
            db.collection("wishes").doc(docId).get().then((doc) => {
                if (doc.exists) { 
                    wishData = doc.data(); 
                    if(wishData.photos) photos = wishData.photos;
                } else { 
                    document.getElementById("main-content-area").innerHTML = "<h2 style='color:#ff4444;'>Oops! Link Expired. 😥</h2>"; 
                }
            });
        }

        function openGift() {
            let boxSound = document.getElementById("sfx-box");
            boxSound.play().catch(e => console.log("Upload box.mp3 to folder first!"));

            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen().catch(e => console.log(e)); }
            
            // Start Continuous Confetti Magic
            startContinuousConfetti();

            if(wishData.music) {
                setTimeout(() => {
                    let audio = document.getElementById("bg-audio");
                    audio.src = wishData.music; audio.play().catch(e => console.log(e));
                }, 1000); 
            }

            document.getElementById("gift-screen").style.display = "none";
            document.getElementById("surprise-screen").style.display = "flex";

            document.getElementById("display-title").innerText = `Happy Birthday ${wishData.name}!`;
            document.getElementById("display-message").innerText = wishData.message;

            setupSlider();
        }

        // --- SLIDER LOGIC ---
        function setupSlider() {
            let imgEl = document.getElementById("current-img");
            let controlsEl = document.getElementById("slider-controls");

            if (photos.length === 0) {
                document.getElementById("slider-area").style.display = "none";
                return;
            }

            imgEl.style.display = "block";
            
            if (photos.length === 1) {
                controlsEl.style.display = "none";
                updateSlideView();
            } else {
                controlsEl.style.display = "flex";
                updateSlideView();
                slideInterval = setInterval(autoSlideNext, 2000);
            }
        }

        function updateSlideView() {
            document.getElementById("current-img").src = photos[currentSlideIndex].url;
            document.getElementById("current-cap").innerText = photos[currentSlideIndex].caption || '';
        }

        function autoSlideNext() {
            currentSlideIndex = (currentSlideIndex + 1) % photos.length;
            updateSlideView();
        }

        function manualSlide(direction) {
            if (slideInterval) {
                clearInterval(slideInterval);
                slideInterval = null;
            }

            if (direction === 'next') {
                currentSlideIndex = (currentSlideIndex + 1) % photos.length;
            } else {
                currentSlideIndex = (currentSlideIndex - 1 + photos.length) % photos.length;
            }
            updateSlideView();
        }

        // --- CONTINUOUS CONFETTI LOGIC ---
        function startContinuousConfetti() {
            setInterval(function() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#b100ff', '#ff1493', '#00ffff'], zIndex: 1000 });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#b100ff', '#ff1493', '#00ffff'], zIndex: 1000 });
            }, 150); // Har 150ms me thode thode phool girenge
        }
    </script>
</body>
</html>
