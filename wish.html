<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Someone Sent You A Surprise!</title>
    <style>
        /* DJ Lights */
        @keyframes djLights { 0% { background-color: #ff00ff; } 15% { background-color: #00ffff; } 30% { background-color: #ffff00; } 45% { background-color: #ff0000; } 60% { background-color: #00ff00; } 75% { background-color: #0000ff; } 90% { background-color: #ff8c00; } 100% { background-color: #ff00ff; } }
        body.disco-mode { animation: djLights 0.8s infinite alternate; }
        
        /* Base Styling */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0d12; color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;}
        .container { width: 100%; max-width: 500px; background: rgba(26, 26, 36, 0.9); padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); text-align: center; margin-bottom: 30px; box-sizing: border-box;}
        
        h1 { color: #00ffff; text-shadow: 0 0 10px #00ffff; font-size: 28px; margin-bottom: 15px; line-height: 1.4; }
        
        /* Gift Box */
        .gift-emoji { font-size: 150px; cursor: pointer; display: inline-block; animation: bounce 1.2s infinite; text-shadow: 0 0 30px #ff1493; margin: 40px 0;}
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-30px); } 60% { transform: translateY(-15px); } }
        
        /* Message Box */
        .message-box { background: rgba(37, 37, 50, 0.9); padding: 20px; border-left: 5px solid #ff1493; border-radius: 8px; margin-top: 20px; font-size: 18px; line-height: 1.6; text-align: left; font-style: italic; }
        
        /* 📸 IMAGE MODULE */
        .timeline-container { display: flex; flex-direction: column; gap: 25px; margin-top: 30px; }
        .memory-card { background: #252532; padding: 20px; border-radius: 12px; border: 2px dashed #00ffff; text-align: center; }
        .memory-card img { width: 100%; border-radius: 8px; max-height: 350px; object-fit: cover; }
        .memory-caption { background: #ff1493; color: white; padding: 10px 20px; border-radius: 8px; font-weight: bold; margin-top: 15px; display: inline-block; font-size: 16px; box-shadow: 0 0 10px rgba(255, 20, 147, 0.5); }
        
        /* SCRATCH CARD MODULE (Height reduced to 105px) */
        .scratch-container { position: relative; width: 100%; height: 105px; margin-top: 30px; border-radius: 12px; overflow: hidden; border: 2px solid #ff1493; background: #fff;}
        .scratch-message { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: #ff1493; text-align: center; padding: 10px; box-sizing: border-box; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; cursor: pointer; }

        #gift-screen, #surprise-screen { display: none; }
    </style>
</head>
<body>

    <div class="container" id="main-content-area">
        
        <h2 id="loading-text" style="color: #ff1493; text-shadow: 0 0 10px #ff1493; margin-top: 50px;">Loading Magic... ✨</h2>

        <div id="gift-screen">
            <h1 style="color: #ff1493; text-shadow: 0 0 10px #ff1493;">Surprise for you! 🎉</h1>
            <p style="font-size: 18px;">Tap the big gift box to open your surprise...</p>
            <div class="gift-emoji" onclick="openGift()">🎁</div>
        </div>

        <div id="surprise-screen">
            
            <h1 style="font-size: 35px; color: #ff1493; text-shadow: 0 0 10px #ff1493;">🎉 Happy Birthday <span id="display-name"></span>! 🎉</h1>
            
            <div class="message-box" id="display-message"></div>

            <div id="timeline" class="timeline-container"></div>

            <div class="scratch-container" id="scratch-area" style="display:none;">
                <div class="scratch-message" id="scratch-text"></div>
                <canvas id="scratch-pad"></canvas>
            </div>

        </div>

    </div>

    <audio id="bg-audio" loop></audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDZjTje3kc9n7K1QfMVBFz1pbDw6-AUS8Q",
            authDomain: "birthday-maker-58e43.firebaseapp.com",
            projectId: "birthday-maker-58e43",
            storageBucket: "birthday-maker-58e43.firebasestorage.app",
            messagingSenderId: "213307256948",
            appId: "1:213307256948:web:4731c4d0c42ee6e978e121"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');
        let wishData = null;

        if(docId) {
            db.collection("wishes").doc(docId).get().then((doc) => {
                document.getElementById("loading-text").style.display = "none";
                
                if (doc.exists) { 
                    wishData = doc.data(); 
                    document.getElementById("gift-screen").style.display = "block";
                } 
                else { 
                    document.getElementById("main-content-area").innerHTML = "<h2 style='color:#ff4444;'>Oops! Link Expired or Invalid. 😥</h2>"; 
                }
            }).catch((error) => {
                document.getElementById("loading-text").style.display = "none";
                document.getElementById("main-content-area").innerHTML = "<h2 style='color:#ff4444;'>Network Error! Please Refresh the Page. 😥</h2>";
                console.error("Firebase Error:", error);
            });
        } else {
            document.getElementById("loading-text").style.display = "none";
            document.getElementById("main-content-area").innerHTML = "<h2 style='color:#ff4444;'>Invalid Link! 🚫</h2>"; 
        }

        function openGift() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen().catch(e => console.log(e)); }
            document.body.classList.add("disco-mode");

            if(wishData.music) {
                let audio = document.getElementById("bg-audio");
                audio.src = wishData.music; 
                audio.play().catch(e => console.log(e));
            }

            document.getElementById("gift-screen").style.display = "none";
            document.getElementById("surprise-screen").style.display = "block";
            
            document.getElementById("display-name").innerText = wishData.name;
            document.getElementById("display-message").innerText = wishData.message;

            let timelineHTML = "";
            if(wishData.photos && wishData.photos.length > 0) {
                wishData.photos.forEach(photo => {
                    let captionText = photo.caption ? photo.caption : "Beautiful Memory ❤️";
                    timelineHTML += `
                        <div class="memory-card">
                            <img src="${photo.url}">
                            <div class="memory-caption">${captionText}</div>
                        </div>
                    `;
                });
            }
            document.getElementById("timeline").innerHTML = timelineHTML;

            if(wishData.scratch && wishData.scratch.trim() !== "") {
                document.getElementById("scratch-area").style.display = "block";
                document.getElementById("scratch-text").innerText = wishData.scratch;
                initScratchCard();
            }

            startConfettiLoop();
        }

        function initScratchCard() {
            const canvas = document.getElementById('scratch-pad');
            const ctx = canvas.getContext('2d');
            let rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = 105; // Height adjust ki gayi hai

            ctx.fillStyle = '#1a1a24';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = '22px Arial';
            ctx.fillStyle = '#00ffff';
            ctx.textAlign = "center";
            ctx.fillText('🪙 Scratch Here!', canvas.width/2, 60); // Text vertically center kiya hai

            let isDrawing = false;
            
            function getPos(e) {
                let r = canvas.getBoundingClientRect();
                let x = (e.clientX || e.touches[0].clientX) - r.left;
                let y = (e.clientY || e.touches[0].clientY) - r.top;
                return {x, y};
            }

            function scratch(e) {
                if(!isDrawing) return;
                e.preventDefault();
                let pos = getPos(e);
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 20, 0, Math.PI*2);
                ctx.fill();
            }

            canvas.addEventListener('mousedown', () => isDrawing = true);
            canvas.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('mousemove', scratch);
            
            canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, {passive: false});
            canvas.addEventListener('touchend', () => isDrawing = false);
            canvas.addEventListener('touchmove', scratch, {passive: false});
        }

        function startConfettiLoop() {
            function shoot() {
                var duration = 1500; 
                var end = Date.now() + duration;
                (function frame() {
                    confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0 }, zIndex: 1000 });
                    confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1 }, zIndex: 1000 });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            }
            
            shoot(); 
            setInterval(shoot, 3500); 
        }
    </script>
</body>
</html>
