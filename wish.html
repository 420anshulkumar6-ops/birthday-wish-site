<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Someone Sent You A Surprise!</title>
    <style>
        /* DJ Lights */
        @keyframes djLights { 0% { background-color: #ff00ff; } 15% { background-color: #00ffff; } 30% { background-color: #ffff00; } 45% { background-color: #ff0000; } 60% { background-color: #00ff00; } 75% { background-color: #0000ff; } 90% { background-color: #ff8c00; } 100% { background-color: #ff00ff; } }
        body.disco-mode { animation: djLights 0.8s infinite alternate; }
        
        /* Base Styling */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0d12; color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;}
        .container { width: 100%; max-width: 500px; background: rgba(26, 26, 36, 0.9); padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); text-align: center; margin-bottom: 30px; box-sizing: border-box;}
        
        h1 { color: #00ffff; text-shadow: 0 0 10px #00ffff; font-size: 28px; margin-bottom: 15px; line-height: 1.4; }
        input { width: 100%; padding: 12px; background: rgba(37, 37, 50, 0.9); border: 1px solid #00ffff; border-radius: 8px; color: white; font-size: 16px; box-sizing: border-box; outline: none; margin-bottom: 15px; text-align: center; }
        .btn { background: linear-gradient(45deg, #00ffff, #0080ff); color: white; border: none; padding: 15px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { box-shadow: 0 0 15px #00ffff; transform: scale(1.02); }
        
        /* Gift Box */
        .gift-emoji { font-size: 150px; cursor: pointer; display: inline-block; animation: bounce 1.2s infinite; text-shadow: 0 0 30px #ff1493; margin: 40px 0;}
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-30px); } 60% { transform: translateY(-15px); } }
        
        /* Modules CSS */
        .message-box { background: rgba(37, 37, 50, 0.9); padding: 20px; border-left: 5px solid #ff1493; border-radius: 8px; margin-top: 20px; font-size: 18px; line-height: 1.6; text-align: left; font-style: italic; }
        .timeline-container { margin-top: 30px; display: flex; flex-direction: column; gap: 25px; }
        .memory-card { background: rgba(37, 37, 50, 0.9); padding: 15px; border-radius: 12px; border: 1px solid #ff1493; box-shadow: 0 4px 15px rgba(255, 20, 147, 0.3); }
        .memory-card img { width: 100%; border-radius: 8px; max-height: 350px; object-fit: cover; }
        
        /* CAKE & MIC MODULE */
        .cake-container { margin-top: 30px; background: #252532; padding: 20px; border-radius: 12px; border: 2px dashed #00ffff;}
        .cake-emoji { font-size: 80px; position: relative; display: inline-block;}
        .flame { font-size: 40px; position: absolute; top: -35px; left: 20px; animation: flicker 0.5s infinite alternate; }
        @keyframes flicker { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0.8; transform: scale(1.1); } }
        
        /* SCRATCH CARD MODULE */
        .scratch-container { position: relative; width: 100%; height: 150px; margin-top: 30px; border-radius: 12px; overflow: hidden; border: 2px solid #ff1493; background: #fff;}
        .scratch-message { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: #ff1493; text-align: center; padding: 10px; box-sizing: border-box; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; cursor: pointer; }

        #gift-screen, #surprise-screen { display: none; }
    </style>
</head>
<body>

    <div class="container" id="main-content-area">
        
        <div id="gift-screen">
            <h1 style="color: #ff1493;">Surprise for you! 🎉</h1>
            <p style="font-size: 18px;">Tap the big gift box to open your surprise...</p>
            <div class="gift-emoji" onclick="openGift()">🎁</div>
        </div>

        <div id="surprise-screen">
            
            <h1 style="font-size: 35px;">🎉 Happy Birthday <span id="display-name" style="color: #ff1493; text-shadow: 0 0 10px #ff1493;"></span>! 🎉</h1>
            
            <div class="message-box" id="display-message"></div>

            <div class="cake-container">
                <h3 style="color:#00ffff; margin-top:0;">🎂 Make a Wish!</h3>
                <p style="font-size:14px; color:#bbb;">Click the button, then blow into your phone's microphone to put out the candle!</p>
                <div class="cake-emoji">
                    <span class="flame" id="flame">🔥</span>
                    🎂
                </div>
                <br>
                <button class="btn" id="mic-btn" style="background:#ff1493; width:auto; padding:10px 20px;" onclick="enableMic()">🎙️ Enable Mic to Blow</button>
                <h3 id="cake-success" style="color:#25D366; display:none;">✨ Wish Granted! ✨</h3>
            </div>

            <div class="scratch-container" id="scratch-area" style="display:none;">
                <div class="scratch-message" id="scratch-text"></div>
                <canvas id="scratch-pad"></canvas>
            </div>

            <div id="timeline" class="timeline-container"></div>
        </div>

    </div>

    <audio id="bg-audio" loop></audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDZjTje3kc9n7K1QfMVBFz1pbDw6-AUS8Q",
            authDomain: "birthday-maker-58e43.firebaseapp.com",
            projectId: "birthday-maker-58e43",
            storageBucket: "birthday-maker-58e43.firebasestorage.app",
            messagingSenderId: "213307256948",
            appId: "1:213307256948:web:4731c4d0c42ee6e978e121"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');
        let wishData = null;

        if(docId) {
            db.collection("wishes").doc(docId).get().then((doc) => {
                if (doc.exists) { 
                    wishData = doc.data(); 
                    document.getElementById("gift-screen").style.display = "block";
                } 
                else { 
                    document.getElementById("main-content-area").innerHTML = "<h2 style='color:#ff4444;'>Oops! Link Expired or Invalid. 😥</h2>"; 
                }
            });
        } else {
            document.getElementById("main-content-area").innerHTML = "<h2 style='color:#ff4444;'>Invalid Link! 🚫</h2>"; 
        }

        function openGift() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) { elem.requestFullscreen().catch(e => console.log(e)); }
            document.body.classList.add("disco-mode");

            if(wishData.music) {
                let audio = document.getElementById("bg-audio");
                audio.src = wishData.music; 
                audio.play().catch(e => console.log(e));
            }

            document.getElementById("gift-screen").style.display = "none";
            document.getElementById("surprise-screen").style.display = "block";
            
            // Name merge ho kar 'display-name' wale span me aayega
            document.getElementById("display-name").innerText = wishData.name;
            document.getElementById("display-message").innerText = wishData.message;

            let timelineHTML = "";
            if(wishData.photos && wishData.photos.length > 0) {
                wishData.photos.forEach(photo => {
                    timelineHTML += `<div class="memory-card"><img src="${photo.url}"><p>✨ ${photo.caption || ''}</p></div>`;
                });
            }
            document.getElementById("timeline").innerHTML = timelineHTML;

            if(wishData.scratch && wishData.scratch.trim() !== "") {
                document.getElementById("scratch-area").style.display = "block";
                document.getElementById("scratch-text").innerText = wishData.scratch;
                initScratchCard();
            }

            fireConfetti();
        }

        let audioContext, analyser, microphone, scriptProcessor;
        async function enableMic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                document.getElementById("mic-btn").innerText = "Blow now! 🌬️";
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                scriptProcessor = audioContext.createScriptProcessor(2048, 1, 1);
                
                microphone.connect(analyser);
                analyser.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination);
                
                scriptProcessor.onaudioprocess = function() {
                    const array = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteFrequencyData(array);
                    let values = 0;
                    for (let i = 0; i < array.length; i++) { values += array[i]; }
                    const average = values / array.length;
                    
                    if (average > 60) {
                        document.getElementById('flame').style.display = 'none'; 
                        document.getElementById('mic-btn').style.display = 'none';
                        document.getElementById('cake-success').style.display = 'block';
                        fireConfetti(); 
                        
                        stream.getTracks().forEach(track => track.stop());
                        scriptProcessor.disconnect();
                    }
                };
            } catch(e) {
                alert("Please allow Microphone access to blow the candle!");
            }
        }

        function initScratchCard() {
            const canvas = document.getElementById('scratch-pad');
            const ctx = canvas.getContext('2d');
            let rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = 150;

            ctx.fillStyle = '#1a1a24';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = '22px Arial';
            ctx.fillStyle = '#00ffff';
            ctx.textAlign = "center";
            ctx.fillText('🪙 Scratch Here!', canvas.width/2, 80);

            let isDrawing = false;
            
            function getPos(e) {
                let r = canvas.getBoundingClientRect();
                let x = (e.clientX || e.touches[0].clientX) - r.left;
                let y = (e.clientY || e.touches[0].clientY) - r.top;
                return {x, y};
            }

            function scratch(e) {
                if(!isDrawing) return;
                e.preventDefault();
                let pos = getPos(e);
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 20, 0, Math.PI*2);
                ctx.fill();
            }

            canvas.addEventListener('mousedown', () => isDrawing = true);
            canvas.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('mousemove', scratch);
            
            canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, {passive: false});
            canvas.addEventListener('touchend', () => isDrawing = false);
            canvas.addEventListener('touchmove', scratch, {passive: false});
        }

        function fireConfetti() {
            var duration = 2 * 1000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
