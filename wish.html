<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise For You!</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0d12; color: #ffffff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; text-align: center;}
        
        /* Royal Text & Button Styles */
        .royal-text { color: #ffd700; font-size: 32px; font-weight: bold; font-family: 'Georgia', serif; text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 215, 0, 0.5); letter-spacing: 2px; margin-top: 20px;}
        .royal-btn { background: linear-gradient(45deg, #d4af37, #ffd700); color: #000; border: none; padding: 15px 30px; font-size: 20px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); margin-top: 30px; transition: 0.3s; font-family: 'Georgia', serif;}
        .royal-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 215, 0, 0.8); }

        /* Party Elements (Placeholders for Canva Images) */
        #box-element { font-size: 150px; cursor: pointer; animation: float 2s infinite; margin-top: 50px; display: inline-block;}
        #decor-element { display: none; font-size: 60px; margin-top: 20px; }
        #balloons-element { display: none; font-size: 80px; margin-top: 20px; }
        #cake-element { display: none; font-size: 120px; margin-top: 20px; }
        
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* Final Content Screens */
        #party-builder-screen { display: none; width: 100%; max-width: 500px; padding: 20px; }
        #final-surprise-screen { display: none; width: 100%; max-width: 500px; background: rgba(26, 26, 36, 0.9); padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); margin-top: 30px; box-sizing: border-box;}
        
        .message-box { background: rgba(37, 37, 50, 0.9); padding: 20px; border-left: 5px solid #ff1493; border-radius: 8px; margin-top: 20px; font-size: 18px; line-height: 1.6; text-align: left; font-style: italic; }
        .memory-card { background: rgba(37, 37, 50, 0.9); padding: 15px; border-radius: 12px; border: 1px solid #ff1493; margin-top: 25px; }
        .memory-card img { width: 100%; border-radius: 8px; max-height: 350px; object-fit: cover; }
    </style>
</head>
<body>

    <!-- All Sound Effects (Save these files in your folder later) -->
    <audio id="sfx-box" src="box_open.mp3"></audio>
    <audio id="sfx-decor" src="decorate.mp3"></audio>
    <audio id="sfx-balloon" src="balloon_show.mp3"></audio>
    <audio id="sfx-cake" src="cake_place.mp3"></audio>
    <audio id="sfx-candle" src="candle.mp3"></audio>
    <audio id="sfx-pop" src="pop.mp3"></audio>
    <audio id="bg-audio" loop></audio>

    <!-- Initial Loading -->
    <h2 id="loading-text" style="color:#fff; margin-top: 50vh;">Loading Magic...</h2>

    <!-- STEP 1: The Royal Entrance -->
    <div id="entrance-screen" style="display:none; width:100%;">
        <div id="box-element" onclick="startParty()">🎁</div><br>
        <div class="royal-text">Tap it</div>
    </div>

    <!-- STEP 2: The Party Builder -->
    <div id="party-builder-screen">
        <div id="decor-element">✨🎊✨</div>
        <div id="balloons-element">🎈🎈🎈</div>
        <div id="cake-element">🎂</div>
        
        <button id="action-btn" class="royal-btn" onclick="nextAction()" style="display:none;">Decorate the Room</button>
    </div>

    <!-- FINAL STEP: The Surprise Reveal -->
    <div id="final-surprise-screen">
        <!-- Naya Custom Title aur Name -->
        <h1 id="display-title" style="font-size: 30px; color: #00ffff;"></h1>
        <h2 id="display-name" style="color: #ff1493; font-size: 35px; margin-bottom: 5px;"></h2>
        
        <div class="message-box" id="display-message"></div>
        <div id="timeline"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDZjTje3kc9n7K1QfMVBFz1pbDw6-AUS8Q",
            authDomain: "birthday-maker-58e43.firebaseapp.com",
            projectId: "birthday-maker-58e43",
            storageBucket: "birthday-maker-58e43.firebasestorage.app",
            messagingSenderId: "213307256948",
            appId: "1:213307256948:web:4731c4d0c42ee6e978e121"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');
        let wishData = null;
        let partyStep = 0;

        // Fetch Data First (No Password required now)
        if(docId) {
            db.collection("wishes").doc(docId).get().then((doc) => {
                if (doc.exists) { 
                    wishData = doc.data(); 
                    document.getElementById("loading-text").style.display = "none";
                    document.getElementById("entrance-screen").style.display = "block";
                } else {
                    document.getElementById("loading-text").innerText = "Link Expired or Invalid.";
                }
            });
        }

        function playSound(id) {
            let audio = document.getElementById(id);
            if(audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Sound error (Canva files pending):", e));
            }
        }

        // Tap the Box -> Opens Party Builder
        function startParty() {
            playSound('sfx-box');
            document.getElementById("entrance-screen").style.display = "none";
            document.getElementById("party-builder-screen").style.display = "block";
            document.getElementById("action-btn").style.display = "inline-block";
        }

        // Party Builder Flow
        function nextAction() {
            let btn = document.getElementById("action-btn");
            
            if (partyStep === 0) {
                playSound('sfx-decor');
                document.getElementById("decor-element").style.display = "block";
                btn.innerText = "Attach Balloons";
                partyStep++;
            } 
            else if (partyStep === 1) {
                playSound('sfx-balloon');
                document.getElementById("balloons-element").style.display = "block";
                btn.innerText = "Place the Cake";
                partyStep++;
            } 
            else if (partyStep === 2) {
                playSound('sfx-cake');
                document.getElementById("cake-element").style.display = "block";
                btn.innerText = "Cut the Cake";
                partyStep++;
            } 
            else if (partyStep === 3) {
                playSound('sfx-candle'); // Cake cutting sound
                document.getElementById("cake-element").innerText = "🍰"; // Visual changes to cut cake
                btn.innerText = "Let's Celebrate!";
                partyStep++;
            } 
            else if (partyStep === 4) {
                playSound('sfx-pop');
                
                // Start Main BG Music
                if(wishData.music) {
                    let bgAudio = document.getElementById("bg-audio");
                    bgAudio.src = wishData.music;
                    bgAudio.play().catch(e => console.log(e));
                }

                // Hide Builder, Show Final Reveal
                document.getElementById("party-builder-screen").style.display = "none";
                document.getElementById("final-surprise-screen").style.display = "block";

                // Setup Final Data
                document.getElementById("display-title").innerText = wishData.title || "Special Surprise!";
                document.getElementById("display-name").innerText = wishData.name;
                document.getElementById("display-message").innerText = wishData.message;

                let timelineHTML = "";
                if(wishData.photos && wishData.photos.length > 0) {
                    wishData.photos.forEach(photo => {
                        timelineHTML += `<div class="memory-card"><img src="${photo.url}"><p>✨ ${photo.caption || ''}</p></div>`;
                    });
                }
                document.getElementById("timeline").innerHTML = timelineHTML;

                // Heavy Confetti Blast
                var duration = 4 * 1000;
                var animationEnd = Date.now() + duration;
                var interval = setInterval(function() {
                    var timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) return clearInterval(interval);
                    confetti({ particleCount: 50, spread: 360, origin: { x: Math.random(), y: Math.random() - 0.2 } });
                }, 250);
            }
        }
    </script>
</body>
</html>
