<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Video Wish For You ✨</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d0d12; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

        /* ================= 1. GIFT SCREEN (Initial View) ================= */
        #gift-screen { text-align: center; z-index: 50; position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #1a1a24 0%, #0d0d12 100%); }
        .gift-box { font-size: 100px; cursor: pointer; animation: shake 1.5s infinite; transition: 0.3s; margin-bottom: 20px; }
        .gift-box:hover { transform: scale(1.1); }
        .tap-text { font-size: 22px; color: #00ffff; font-weight: bold; text-shadow: 0 0 10px rgba(0,255,255,0.5); animation: pulse 1s infinite; }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
            75% { transform: rotate(-10deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* ================= 2. SURPRISE SCREEN (Video Player) ================= */
        #surprise-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; }
        
        /* Background Video */
        #bg-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; pointer-events: none; }

        /* The Virtual Box / Jadoo Area (For Photo & Name) */
        .magic-container { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 5; display: flex; flex-direction: column; align-items: center; text-align: center; width: 80%; max-width: 350px; }
        
        .user-photo { width: 150px; height: 150px; object-fit: cover; border-radius: 50%; border: 4px solid #ff1493; box-shadow: 0 0 25px rgba(255,20,147,0.8); margin-bottom: 15px; animation: popIn 1s ease-out forwards; opacity: 0; }
        
        .user-name { font-size: 32px; font-weight: bold; color: #fff; text-shadow: 2px 2px 5px #000, 0 0 20px #00ffff; animation: slideUp 1s ease-out 0.5s forwards; opacity: 0; }

        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideUp { 0% { transform: translateY(30px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        /* ================= 3. ACTION BUTTONS (Share & Download) ================= */
        .action-buttons { display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; flex-direction: column; gap: 12px; z-index: 10; }
        .action-btn { color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 16px; text-align: center; text-decoration: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .action-btn:hover { transform: translateY(-3px); }
        
        .btn-download { background: linear-gradient(45deg, #ff1493, #ff4500); }
        .btn-whatsapp { background: #25D366; }
        .btn-link { background: #333; border: 1px solid #555; }
    </style>
</head>
<body>

    <!-- 1. Gift Screen -->
    <div id="gift-screen" onclick="openGift()">
        <div class="gift-box">🎁</div>
        <div class="tap-text">Tap to Open Your Surprise!</div>
    </div>

    <!-- 2. Surprise Screen (Hidden initially) -->
    <div id="surprise-screen">
        <!-- Main Video -->
        <video id="bg-video" loop playsinline>
            <source src="bg_video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- Hidden Audio (If specific song is attached) -->
        <audio id="bg-audio" loop></audio>

        <!-- Magic Container (Photo & Name Layer) -->
        <div class="magic-container">
            <img id="user-photo-display" class="user-photo" src="https://via.placeholder.com/150" alt="User Photo">
            <h1 id="user-name-display" class="user-name">Your Name</h1>
        </div>

        <!-- 3. Action Buttons (Appear after opening) -->
        <div class="action-buttons" id="action-panel">
            <button class="action-btn btn-download" onclick="downloadVideo()">⬇️ Download Video</button>
            <button class="action-btn btn-whatsapp" onclick="shareToWhatsApp()">📲 Share to WhatsApp Status</button>
            <button class="action-btn btn-link" onclick="copyLink()">🔗 Copy Link</button>
        </div>
    </div>

    <!-- Javascript Logic -->
    <script>
        // Step 1: Load Data from LocalStorage (Saved by create.html)
        document.addEventListener("DOMContentLoaded", () => {
            const savedData = localStorage.getItem('wishmaker_data');
            if(savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('user-name-display').innerText = data.name || "Special Person";
                
                if(data.photo) {
                    document.getElementById('user-photo-display').src = data.photo;
                }
                
                // If you have logic to set specific video based on theme
                if(data.videoFile) {
                    document.getElementById('bg-video').src = data.videoFile;
                }
            }
        });

        // Step 2: Open Gift & Play Media
        function openGift() {
            // Hide Gift Screen, Show Surprise Screen
            document.getElementById("gift-screen").style.display = "none";
            document.getElementById("surprise-screen").style.display = "block";
            
            // Try Fullscreen (Mobile experience)
            try { document.documentElement.requestFullscreen(); } catch(e) {}

            // Play Video
            let bgVideo = document.getElementById("bg-video");
            bgVideo.muted = false; 
            bgVideo.volume = 0.5; 
            bgVideo.play().catch(e => console.log("Video play blocked by browser")); 

            // Play Audio (If you have a separate MP3 file)
            let audio = document.getElementById("bg-audio");
            if(audio.src && audio.src !== window.location.href) {
                audio.volume = 1.0; 
                audio.play().catch(e => console.log("Audio play blocked"));
            }
            
            // Show Action Buttons after a slight delay for better effect
            setTimeout(() => {
                document.getElementById("action-panel").style.display = "flex";
            }, 1500);
        }

        // Step 3: Button Functions
        function shareToWhatsApp() {
            let currentLink = window.location.href;
            let text = `✨ I have made a magical video card for you! Open it here: ${currentLink}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`);
        }

        function copyLink() {
            let currentLink = window.location.href;
            navigator.clipboard.writeText(currentLink).then(() => {
                alert("Link Copied! You can now paste it anywhere.");
            });
        }

        function downloadVideo() {
            alert("Processing your video... (Note: Video processing server will be attached here later for downloading MP4)");
            // Future Logic: Send localStorage data to your backend FFmpeg server to render real MP4.
        }
    </script>
</body>
</html>
