<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Birthday Wish</title>
    <style>
        body { 
            margin: 0; padding: 0; background-color: #000; 
            display: flex; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; 
        }

        #loading-text { color: #ff1493; position: absolute; font-family: sans-serif; font-weight: bold;}
        #gift-screen { 
            display: none; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; height: 100vh; width: 100vw; background: #0d0d12;
        }
        .gift-emoji { font-size: 120px; cursor: pointer; animation: bounce 1.2s infinite; margin-top: 20px;}
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-30px); } 60% { transform: translateY(-15px); } }

        /* Video Wrapper - STRICT 9:16 ASPECT RATIO */
        .video-wrapper {
            display: none; position: relative; width: 100vw; height: 100vh;
            max-width: 56.25vh; max-height: 177.77vw; margin: 0 auto; background: #000;
        }

        /* Background Video */
        #bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        /* 📸 SMART PHOTO CIRCLE: Adjusted to perfectly cover the placeholder */
        .user-photo {
            position: absolute;
            top: 36.5%; /* Upar shift kiya taaki badal wala hissa cover ho jaye */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55.5%; /* Size thoda badhaya taaki frame puri tarah bhar jaye */
            aspect-ratio: 1/1; 
            border-radius: 50%; 
            object-fit: cover; 
            z-index: 2;
        }

        /* Name strictly over the Ribbon */
        .user-name {
            position: absolute;
            top: 60%; 
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 26px;
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            width: 75%;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
            z-index: 3; 
        }
    </style>
</head>
<body>

    <h2 id="loading-text">Loading Magic... ✨</h2>

    <div id="gift-screen">
        <h1 style="color: #ff1493; font-family: sans-serif;">Surprise for you! 🎉</h1>
        <p style="color: #bbb; font-family: sans-serif;">Tap to open</p>
        <div class="gift-emoji" onclick="openGift()">🎁</div>
    </div>

    <div class="video-wrapper" id="surprise-screen">
        <video id="bg-video" loop playsinline>
            <source src="bg_video.mp4" type="video/mp4">
        </video>
        
        <img id="user-img" class="user-photo" src="" alt="Photo">
        <div id="user-name" class="user-name"></div>
    </div>

    <audio id="bg-audio" loop></audio>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDZjTje3kc9n7K1QfMVBFz1pbDw6-AUS8Q", authDomain: "birthday-maker-58e43.firebaseapp.com", projectId: "birthday-maker-58e43", storageBucket: "birthday-maker-58e43.firebasestorage.app", messagingSenderId: "213307256948", appId: "1:213307256948:web:4731c4d0c42ee6e978e121" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let wishData = null;

        const urlParams = new URLSearchParams(window.location.search);
        db.collection("wishes").doc(urlParams.get('id')).get().then(doc => {
            document.getElementById("loading-text").style.display = "none";
            if(doc.exists) { 
                wishData = doc.data(); 
                document.getElementById("gift-screen").style.display = "flex"; 
            } else {
                document.body.innerHTML = "<h2 style='color:red; font-family:sans-serif;'>Link Expired!</h2>";
            }
        });

        function openGift() {
            document.documentElement.requestFullscreen().catch(e => console.log(e));
            
            // Audio Mixing
            let audio = document.getElementById("bg-audio");
            if(wishData.music) {
                audio.src = wishData.music;
                audio.volume = 0.8; 
                audio.play().catch(e => console.log(e));
            }

            let bgVideo = document.getElementById("bg-video");
            bgVideo.muted = false; 
            bgVideo.volume = 0.2; 
            bgVideo.play().catch(e => console.log(e)); 

            // UI Switch
            document.getElementById("gift-screen").style.display = "none";
            document.getElementById("surprise-screen").style.display = "block";
            
            // Assign Data
            document.getElementById("user-img").src = wishData.photos[0].url;
            document.getElementById("user-name").innerText = wishData.name;
        }
    </script>
</body>
</html>
