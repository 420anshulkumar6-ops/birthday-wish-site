<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Birthday Wish</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Georgia', serif; background-color: #eefbff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .poster { width: 100%; max-width: 400px; height: 100vh; position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 50px; box-sizing: border-box; }
        
        /* Bunting Flags */
        .flags { width: 100%; height: 50px; position: absolute; top: 0; background: url('https://www.transparenttextures.com/patterns/cubes.png'); }

        /* Typography */
        .h-title { font-size: 45px; color: #1a3a5a; margin: 0; }
        
        /* Photo Frame */
        .photo-circle { width: 180px; height: 180px; border-radius: 50%; border: 6px solid #a3d5ea; margin: 20px 0; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .photo-circle img { width: 100%; height: 100%; object-fit: cover; }

        /* Name Ribbon */
        .ribbon { background: #5d9bc9; color: white; padding: 10px 40px; font-size: 30px; transform: skewX(-10deg); margin: 10px 0; box-shadow: 5px 5px 0 #3a7aab; }

        /* Message */
        .message { color: #333; font-size: 16px; text-align: center; padding: 0 20px; line-height: 1.4; }

        /* Bottom Cake */
        .cake { font-size: 80px; margin-top: auto; margin-bottom: 20px; }

        /* Balloons (Positioned using absolute) */
        .balloon { position: absolute; font-size: 50px; }
    </style>
</head>
<body>

    <div class="poster">
        <div class="flags"></div>
        <h1 class="h-title">Happy<br>Birthday</h1>
        
        <div class="photo-circle"><img id="user-img" src=""></div>
        
        <div class="ribbon" id="user-name">Name</div>
        
        <div class="message" id="user-msg"></div>
        
        <div class="cake">🎂</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDZjTje3kc9n7K1QfMVBFz1pbDw6-AUS8Q", authDomain: "birthday-maker-58e43.firebaseapp.com", projectId: "birthday-maker-58e43", storageBucket: "birthday-maker-58e43.firebasestorage.app", messagingSenderId: "213307256948", appId: "1:213307256948:web:4731c4d0c42ee6e978e121" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        db.collection("wishes").doc(urlParams.get('id')).get().then(doc => {
            if(doc.exists) {
                let data = doc.data();
                document.getElementById('user-img').src = data.photos[0].url;
                document.getElementById('user-name').innerText = data.name;
                document.getElementById('user-msg').innerText = data.message;
            }
        });
    </script>
</body>
</html>
