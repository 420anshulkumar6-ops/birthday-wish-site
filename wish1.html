<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raksha Bandhan Special Wish ✨</title>
    <style>
        body { 
            margin: 0; padding: 0; background-color: #000; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #loading-text { color: #ff1493; position: absolute; font-weight: bold; top: 40%;}
        
        #gift-screen { 
            display: none; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; height: 100vh; width: 100vw; background: #0d0d12; z-index: 50; position: absolute;
        }
        .gift-emoji { font-size: 120px; cursor: pointer; animation: bounce 1.2s infinite; margin-top: 20px;}
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-30px); } 60% { transform: translateY(-15px); } }

        .video-wrapper {
            display: none; position: relative; width: 100vw; height: calc(100vh - 220px); /* Adjuster ke liye jagah chhodi hai */
            max-width: 56.25vh; margin: 0 auto; background: #000; overflow: hidden;
        }

        #bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        /* Initial Photo Settings (Ye JS se live update hogi) */
        .user-photo {
            position: absolute;
            transform: translate(-50%, -50%);
            aspect-ratio: 1/1; 
            object-fit: cover; 
            object-position: center; 
            z-index: 2;
            border: 2px solid rgba(255, 255, 255, 0.3); /* Adjust karte waqt border dikhega */
        }

        /* =========================================
           🛠️ LIVE ADJUSTER PANEL UI
           ========================================= */
        #adjuster-panel {
            display: none; /* Gift open hone ke baad dikhega */
            width: 100%; height: 220px; background: #0a0a0f; 
            border-top: 2px solid #00ffff; padding: 15px 20px; box-sizing: border-box;
            z-index: 100;
        }
        #adjuster-panel h3 { color: #00ffff; margin: 0 0 15px 0; font-size: 16px; }
        
        .slider-row { margin-bottom: 12px; }
        .slider-row label { display: block; color: #fff; font-size: 13px; margin-bottom: 5px; }
        .slider-row span { color: #00ffff; font-weight: bold; }
        
        /* Slider Styling */
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #00ffff; cursor: pointer; margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #fff; border-radius: 2px;
        }
    </style>
</head>
<body>

    <h2 id="loading-text">Loading Magic... ✨</h2>

    <!-- Gift Box Screen -->
    <div id="gift-screen">
        <h1 style="color: #ff1493; font-family: sans-serif;">Surprise for you! 🎉</h1>
        <p style="color: #bbb; font-family: sans-serif;">Tap to open</p>
        <div class="gift-emoji" onclick="openGift()">🎁</div>
    </div>

    <!-- Main Video Screen -->
    <div class="video-wrapper" id="surprise-screen">
        <video id="bg-video" loop playsinline>
            <source src="bg_video1.mp4" type="video/mp4">
        </video>
        <img id="user-img" class="user-photo" src="https://via.placeholder.com/300" alt="Photo">
    </div>

    <!-- Live Photo Adjuster -->
    <div id="adjuster-panel">
        <h3>Photo Adjuster 🛠️</h3>
        
        <div class="slider-row">
            <label>Top (Upar/Niche): <span id="val-top">35.8%</span></label>
            <input type="range" id="slider-top" min="0" max="100" step="0.1" value="35.8">
        </div>
        
        <div class="slider-row">
            <label>Left (Left/Right): <span id="val-left">50%</span></label>
            <input type="range" id="slider-left" min="0" max="100" step="0.1" value="50">
        </div>
        
        <div class="slider-row">
            <label>Size (Bada/Chhota): <span id="val-size">78%</span></label>
            <input type="range" id="slider-size" min="0" max="100" step="0.1" value="78">
        </div>

        <div class="slider-row">
            <label>Roundness (Golayi): <span id="val-round">0%</span></label>
            <input type="range" id="slider-round" min="0" max="50" step="1" value="0">
        </div>
    </div>

    <audio id="bg-audio" loop>
        <source src="music4.mp3" type="audio/mpeg">
    </audio>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDZjTje3kc9n7K1QfMVBFz1pbDw6-AUS8Q", 
            authDomain: "birthday-maker-58e43.firebaseapp.com", 
            projectId: "birthday-maker-58e43", 
            storageBucket: "birthday-maker-58e43.firebasestorage.app", 
            messagingSenderId: "213307256948", 
            appId: "1:213307256948:web:4731c4d0c42ee6e978e121" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let wishData = null;

        const urlParams = new URLSearchParams(window.location.search);
        db.collection("wishes").doc(urlParams.get('id')).get().then(doc => {
            document.getElementById("loading-text").style.display = "none";
            if(doc.exists) { 
                wishData = doc.data(); 
                document.getElementById("gift-screen").style.display = "flex"; 
            } else {
                document.body.innerHTML = "<h2 style='color:red; text-align:center; margin-top:50px;'>Link Expired!</h2>";
            }
        });

        function openGift() {
            let audio = document.getElementById("bg-audio");
            if(wishData && wishData.music) { audio.src = wishData.music; }
            audio.volume = 0.8; 
            audio.play().catch(e => console.log("Audio play blocked"));

            let bgVideo = document.getElementById("bg-video");
            bgVideo.muted = false; 
            bgVideo.volume = 0.2; 
            bgVideo.play().catch(e => console.log("Video play blocked")); 

            document.getElementById("gift-screen").style.display = "none";
            document.getElementById("surprise-screen").style.display = "block";
            document.getElementById("adjuster-panel").style.display = "block";
            
            if(wishData && wishData.photos && wishData.photos.length > 0) {
                document.getElementById("user-img").src = wishData.photos[0].url;
            }
            
            // Apply initial slider values to photo
            updatePhotoStyle();
        }

        /* =========================================
           🛠️ LIVE ADJUSTER JAVASCRIPT
           ========================================= */
        const img = document.getElementById('user-img');
        
        const slTop = document.getElementById('slider-top');
        const slLeft = document.getElementById('slider-left');
        const slSize = document.getElementById('slider-size');
        const slRound = document.getElementById('slider-round');

        const valTop = document.getElementById('val-top');
        const valLeft = document.getElementById('val-left');
        const valSize = document.getElementById('val-size');
        const valRound = document.getElementById('val-round');

        function updatePhotoStyle() {
            // Update CSS
            img.style.top = slTop.value + '%';
            img.style.left = slLeft.value + '%';
            img.style.width = slSize.value + '%';
            img.style.borderRadius = slRound.value + '%';

            // Update Text
            valTop.innerText = slTop.value + '%';
            valLeft.innerText = slLeft.value + '%';
            valSize.innerText = slSize.value + '%';
            valRound.innerText = slRound.value + '%';
        }

        // Listen for slider changes
        slTop.addEventListener('input', updatePhotoStyle);
        slLeft.addEventListener('input', updatePhotoStyle);
        slSize.addEventListener('input', updatePhotoStyle);
        slRound.addEventListener('input', updatePhotoStyle);
    </script>
</body>
</html>
