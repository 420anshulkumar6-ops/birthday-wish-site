<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raksha Bandhan Special Wish ✨</title>
    <style>
        body { 
            margin: 0; padding: 0; background-color: #000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #loading-text { color: #ff1493; position: absolute; font-weight: bold; top: 40%;}
        
        #gift-screen { 
            display: none; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; height: 100vh; width: 100vw; background: #0d0d12; z-index: 50; position: absolute;
        }
        .gift-emoji { font-size: 120px; cursor: pointer; animation: bounce 1.2s infinite; margin-top: 20px;}
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-30px); } 60% { transform: translateY(-15px); } }

        .video-wrapper {
            display: none; position: relative; width: 100vw; height: 100vh;
            max-width: 56.25vh; max-height: 177.77vw; margin: 0 auto; background: #000; overflow: hidden;
        }

        #bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        /* 📸 FINAL PHOTO SETTINGS */
        .user-photo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55%; /* Zoom size set to 55% */
            aspect-ratio: 1/1; 
            border-radius: 50%; /* 100% Round */
            object-fit: cover; 
            object-position: center; 
            z-index: 2;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3); /* Halka sa glow video me merge karne ke liye */
        }
    </style>
</head>
<body>

    <h2 id="loading-text">Loading Magic... ✨</h2>

    <!-- Gift Box Screen -->
    <div id="gift-screen">
        <h1 style="color: #ff1493; font-family: sans-serif;">Surprise for you! 🎉</h1>
        <p style="color: #bbb; font-family: sans-serif;">Tap to open</p>
        <div class="gift-emoji" onclick="openGift()">🎁</div>
    </div>

    <!-- Main Video Screen -->
    <div class="video-wrapper" id="surprise-screen">
        <!-- Background Video -->
        <video id="bg-video" loop playsinline>
            <source src="bg_video1.mp4" type="video/mp4">
        </video>
        
        <!-- User Photo -->
        <img id="user-img" class="user-photo" src="" alt="Photo">
    </div>

    <!-- Background Audio -->
    <audio id="bg-audio" loop>
        <source src="music4.mp4" type="audio/mp4">
        <source src="music4.mp3" type="audio/mpeg">
    </audio>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyDZjTje3kc9n7K1QfMVBFz1pbDw6-AUS8Q", 
            authDomain: "birthday-maker-58e43.firebaseapp.com", 
            projectId: "birthday-maker-58e43", 
            storageBucket: "birthday-maker-58e43.firebasestorage.app", 
            messagingSenderId: "213307256948", 
            appId: "1:213307256948:web:4731c4d0c42ee6e978e121" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let wishData = null;

        const urlParams = new URLSearchParams(window.location.search);
        db.collection("wishes").doc(urlParams.get('id')).get().then(doc => {
            document.getElementById("loading-text").style.display = "none";
            if(doc.exists) { 
                wishData = doc.data(); 
                document.getElementById("gift-screen").style.display = "flex"; 
            } else {
                document.body.innerHTML = "<h2 style='color:red; text-align:center; width:100%; margin-top:50px;'>Link Expired!</h2>";
            }
        });

        function openGift() {
            document.documentElement.requestFullscreen().catch(e => console.log("Fullscreen ignored"));

            let audio = document.getElementById("bg-audio");
            // Custom music or default
            if(wishData && wishData.music && wishData.music !== "music4.mp3" && wishData.music !== "music4.mp4") { 
                audio.src = wishData.music; 
            }
            audio.volume = 0.8; 
            audio.play().catch(e => console.log("Audio play blocked"));

            let bgVideo = document.getElementById("bg-video");
            bgVideo.muted = false; 
            bgVideo.volume = 0.2; 
            bgVideo.play().catch(e => console.log("Video play blocked")); 

            document.getElementById("gift-screen").style.display = "none";
            document.getElementById("surprise-screen").style.display = "block";
            
            if(wishData && wishData.photos && wishData.photos.length > 0) {
                document.getElementById("user-img").src = wishData.photos[0].url;
            }
        }
    </script>
</body>
</html>
